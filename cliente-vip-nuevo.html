    '<div class="ctl">'+(n?'<button class="b men" data-m="'+k+'" aria-label="Quitar uno">−</button><span class="cant">'+n+'</span>':"")+'<button class="b mas" data-a="'+k+'" aria-label="Agregar">+</button></div></div>';}

function render(){var t=q.trim().toLowerCase();var h="";
  if(t){var r=Object.keys(prods).filter(function(k){var p=prods[k];if(esMay()?!vendeMay(k):false)return false;return p.n.toLowerCase().indexOf(t)>=0||p.raw.toLowerCase().indexOf(t)>=0||String(p.c).indexOf(t)>=0;});
    h='<section class="sec"><h2>Resultados <span>'+r.length+'</span></h2>'+(r.map(fila).join("")||'<div class="vacio">No encontramos ese producto. Probá con otra palabra o el código.</div>')+'</section>';}
  else h=secciones.map(function(s){return '<section class="sec" id="'+s.id+'"><h2>'+s.ic+" "+s.t+' <span>'+s.items.length+'</span></h2>'+s.items.map(fila).join("")+'</section>';}).join("")+
    '<div class="pie"><p><b>FRIOTEKA</b> es una tienda de descuentos especialista en alimentos congelados, con la mayor variedad del mercado argentino.</p>'+
    '<a class="waof" href="'+WA_OFERTAS+'" target="_blank" rel="noopener">💬 Recibí las ofertas por WhatsApp</a></div>';
  $("lista").innerHTML=h;totales();}

function calc(){var u=0,t=0;Object.keys(ped).forEach(function(k){var p=prods[k];if(!p)return;u+=ped[k];t+=ped[k]*precio(p);});return {u:u,t:t};}
function avisoEnvio(t,u){
  if(!u)return null;
  if(esMay()) return t>=ENVIO_CAJA?{ok:1,tx:"🚚 ¡Envío gratis desbloqueado!"}:{tx:"Te faltan "+fmt(ENVIO_CAJA-t)+" para el envío gratis ("+fmt(ENVIO_CAJA)+")"};
  return envioVipHoy()?{ok:1,tx:"🚚 Hoy el envío es gratis"}:{tx:"🚚 Envío gratis los miércoles y viernes"};
}
function totales(){var r=calc();var may=esMay();var b=$("badge");b.textContent=r.u;b.style.display=r.u?"flex":"none";
  $("cantTxt").textContent=r.u?(r.u+(may?(r.u>1?" cajas":" caja"):(r.u>1?" productos":" producto"))+" · Ver pedido →"):"Tu pedido está vacío";
  $("totTxt").textContent=fmt(r.t);$("bVer").classList.toggle("off",!r.u);
  var a=avisoEnvio(r.t,r.u),av=$("aviso");if(a){av.textContent=a.tx;av.className="aviso"+(a.ok?" ok":"");av.style.display="block";}else av.style.display="none";
  return r;}
function cambia(k,d){ped[k]=(ped[k]||0)+d;if(ped[k]<=0)delete ped[k];}

function marco(){var may=esMay();
  $("tabs").innerHTML=secciones.map(function(s,i){return '<button class="tab'+(i?"":" on")+'" data-ir="'+s.id+'">'+s.tab+'</button>';}).join("");
  $("promo").innerHTML=may?'<div><b>Compra mayorista</b><small>Por caja cerrada · envío gratis desde $150.000</small></div><div class="pc" aria-hidden="true">📦</div>':'<div><b>Envío gratis miércoles y viernes</b><small>Sin monto mínimo · precios mayoristas por unidad</small></div><div class="pc" aria-hidden="true">🚚</div>';
  
  var fijos=may?'<button class="mit" data-ir="destmay"><i>⭐</i>Destacados mayoristas<span>›</span></button>':'<button class="mit" data-ir="destvip"><i>⭐</i>Destacados VIP<span>›</span></button>';
  $("mItems").innerHTML='<button class="mit" data-ir="top"><i>🏠</i>Inicio<span>›</span></button>'+fijos+'<button class="mit" data-ped="1"><i>🧾</i>Mi pedido<span>›</span></button><div class="mtit">Familias</div>'+
    secciones.filter(function(s){return ["destvip","destmay"].indexOf(s.id)<0;}).map(function(s){return '<button class="mit" data-ir="'+s.id+'"><i>'+s.ic+'</i>'+s.t+'<span>›</span></button>';}).join("")+
    '<div class="mtit">Contacto</div>'+
    '<a class="mit" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent("Av. Ramón J. Cárcano 619, Villa Carlos Paz, Córdoba")+'" target="_blank" rel="noopener"><i>📍</i><div>Cárcano<div class="cod" style="margin-top:0">Av. Ramón J. Cárcano 619 · Villa Carlos Paz</div>'+(HORARIOS.car?'<div class="cod" style="margin-top:2px">🕘 '+HORARIOS.car+'</div>':'')+'</div><span>›</span></a>'+
    '<a class="mit" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent("Av. San Martín 1211, Villa Carlos Paz, Córdoba")+'" target="_blank" rel="noopener"><i>📍</i><div>San Martín<div class="cod" style="margin-top:0">Av. San Martín 1211 · Villa Carlos Paz</div>'+(HORARIOS.sm?'<div class="cod" style="margin-top:2px">🕘 '+HORARIOS.sm+'</div>':'')+'</div><span>›</span></a>'+
    '<a class="mit" href="https://wa.me/'+WA_NUM+'" target="_blank" rel="noopener"><i>💬</i>WhatsApp 3541 61-3373<span>›</span></a>'+
    '<a class="mit" href="'+WA_OFERTAS+'" target="_blank" rel="noopener"><i>🔔</i>Recibí las ofertas por WhatsApp<span>›</span></a>'+
    '<a class="mit" href="https://frioteka.com.ar/" target="_blank" rel="noopener"><i>🌐</i>Compra online · frioteka.com.ar<span>›</span></a>'+
    '<a class="mit" href="https://www.instagram.com/FriotekaOficial" target="_blank" rel="noopener"><i>📷</i>Instagram · @FriotekaOficial<span>›</span></a>';
  setTimeout(medir,0);}
function cambiarModo(m){MODO=m;document.body.classList.toggle("may",m==="may");ped=PED[m];q="";$("q").value="";armar();marco();render();abrir("menu",false);if($("hoja").classList.contains("on"))hoja();window.scrollTo({top:0});}
function abrir(el,on){$(el).classList.toggle("on",on);$("velo").classList.toggle("on",$("menu").classList.contains("on")||$("hoja").classList.contains("on"));document.body.style.overflow=$("hoja").classList.contains("on")?"hidden":"";}
function marcarTab(id){var on=null;document.querySelectorAll(".tab").forEach(function(b){var s=b.dataset.ir===id;b.classList.toggle("on",s);if(s)on=b;});if(on){var tb=$("tabs");tb.scrollTo({left:on.offsetLeft-tb.clientWidth/2+on.offsetWidth/2,behavior:"smooth"});}}
var bloqueo=0;
function ir(id){abrir("menu",false);if(q){q="";$("q").value="";render();}if(id==="top"){window.scrollTo({top:0,behavior:"smooth"});marcarTab(secciones[0]&&secciones[0].id);return;}
  bloqueo=Date.now();setTimeout(function(){var e=$(id);if(e)e.scrollIntoView({behavior:"smooth"});},30);marcarTab(id);}
/* Pestañas fijas debajo del encabezado y pestaña activa según lo que se ve */
var altoHdr=112;
function medir(){altoHdr=$("hdr").offsetHeight;$("tabs").style.top=altoHdr+"px";var off=altoHdr+$("tabs").offsetHeight+6;document.querySelectorAll(".sec").forEach(function(s){s.style.scrollMarginTop=off+"px";});}
window.addEventListener("resize",medir);
window.addEventListener("scroll",function(){if(q||Date.now()-bloqueo<900)return;var lim=altoHdr+$("tabs").offsetHeight+20,act=null;
  secciones.forEach(function(s){var e=$(s.id);if(e&&e.getBoundingClientRect().top<=lim)act=s.id;});
  if(!act&&secciones[0])act=secciones[0].id;var cur=document.querySelector(".tab.on");if(act&&(!cur||cur.dataset.ir!==act))marcarTab(act);},{passive:true});

/* ===== Hoja del pedido ===== */
function hoja(){var ks=Object.keys(ped);var r=totales();var may=esMay();var prev={};["fNom","fNeg","fDir","fTel"].forEach(function(i){if($(i))prev[i]=$(i).value;});
  var pago=PAGO[MODO];var a=avisoEnvio(r.t,r.u);
  $("hCuerpo").innerHTML=ks.length?ks.map(fila).join("")+
    '<div class="tot"><span>Total'+(may?" mayorista":"")+'</span><span>'+fmt(r.t)+'</span></div>'+
    (a?'<div class="cod" style="padding:0 4px;font-weight:700;color:'+(a.ok?"#1B7D33":"#555")+'">'+a.tx+'</div>':"")+
    '<div class="campo"><label for="fNom">Nombre *</label><input id="fNom" autocomplete="name" placeholder="Tu nombre completo"></div>'+
    (may?'<div class="campo"><label for="fNeg">Negocio</label><input id="fNeg" placeholder="Nombre del negocio (opcional)"></div>':"")+
    '<div class="campo"><label for="fDir">Dirección *</label><input id="fDir" autocomplete="street-address" placeholder="Calle y número"></div>'+
    '<div class="campo"><label for="fTel">Teléfono *</label><input id="fTel" type="tel" autocomplete="tel" placeholder="Tu número de WhatsApp"></div>'+
    '<div class="campo"><label>Forma de pago *</label><div class="pagos">'+[["efectivo","💵 Efectivo"],["transferencia","🏦 Transferencia"]].map(function(x){return '<button class="pago'+(pago===x[0]?" on":"")+'" data-pago="'+x[0]+'">'+x[1]+'</button>';}).join("")+'</div></div>'+
    '<div class="err" id="err">Completá '+(may?"nombre, dirección, teléfono":"nombre, dirección")+' y forma de pago.</div>'+
    '<button class="wa" id="bWa">Enviar pedido por WhatsApp</button>'
    :'<div class="vacio">Todavía no agregaste productos.<br>Tocá + en lo que quieras llevar.</div>';
  Object.keys(prev).forEach(function(i){if($(i))$(i).value=prev[i];});}
function verPed(){hoja();abrir("hoja",true);}

/* ===== Envío: mismo mensaje, mismo número y mismo pendiente en Firebase que cliente.html ===== */
function fecha(){var d=new Date();return {fecha:d.toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit",year:"numeric"}),hora:d.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"})};}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function enviarMin(nombre,dir,tel,fpago){var r=calc();var m="⭐ *PEDIDO VIP FRIOTEKA*\n";m+="📋 "+nombre+"\n";m+="📍 "+dir+"\n";if(tel)m+="📱 "+tel+"\n";m+="💳 "+cap(fpago)+"\n\n";
  var items=[];
  P.forEach(function(p){var c=ped[String(p.codigo)];if(!c)return;var u=p.unidad==="K"?"kg":"u";
    m+="• ["+p.codigo+"] "+p.nombre+" x"+c+u+" = "+fmt(p.precioMayorista*c)+"\n";
    items.push({cod:p.codigo,nom:p.nombre,cant:c,unid:u,precio:p.precioMayorista,subtotal:p.precioMayorista*c});});
  TOGO.forEach(function(t){var c=ped["T"+t.codigo];if(!c)return;var cod=t.codigo;
    m+="• 🍕 ["+cod+"] "+t.nombre+" x"+c+" u = "+fmt(t.precioMay*c)+"\n";
    items.push({cod:cod,nom:t.nombre,cant:c,unid:"u",precio:t.precioMay,subtotal:t.precioMay*c});});
  m+="\n💰 *TOTAL: "+fmt(r.t)+"*";if(envioVipHoy())m+="\n🚚 Envío gratis (miércoles/viernes)";
  var f=fecha();var pend={id:Date.now(),origen:"cliente-web-vip",fecha:f.fecha,hora:f.hora,cliente:nombre,dir:dir,fpago:fpago,total:r.t,items:items,estado:"pendiente"};
  return {m:m,pend:pend,t:r.t};}
function enviarMay(nombre,negocio,dir,tel,fpago){var r=calc();var m="📦 *PEDIDO MAYORISTA FRIOTEKA*\n";m+="👤 "+nombre+"\n";if(negocio)m+="🏪 "+negocio+"\n";m+="📍 "+dir+"\n";m+="📱 "+tel+"\n";m+="💳 "+cap(fpago)+"\n\n";
  var items=[];
  P.forEach(function(p){var c=ped[String(p.codigo)];if(!c)return;var u=p.unidad==="K"?"kg":"u";var pc=p.precioMayorista*p.unidadesCaja;
    m+="• ["+p.codigo+"] "+p.nombre+" x"+c+" caja"+(c>1?"s":"")+" ("+p.unidadesCaja+u+"/caja) = "+fmt(pc*c)+"\n";
    items.push({cod:p.codigo,nom:p.nombre,cant:c,unid:"caja",precio:pc,subtotal:pc*c});});
  m+="\n💰 *TOTAL: "+fmt(r.t)+"*";if(r.t>=ENVIO_CAJA)m+="\n🚚 Envío gratis";
  var f=fecha();var pend={id:Date.now(),origen:"cliente-web-mayorista",fecha:f.fecha,hora:f.hora,cliente:nombre,negocio:negocio,dir:dir,tel:tel,fpago:fpago,total:r.t,items:items,estado:"pendiente"};
  return {m:m,pend:pend,t:r.t};}
function enviar(){var may=esMay();function v(i){return $(i)?$(i).value.trim():"";}
  var nombre=v("fNom"),dir=v("fDir"),tel=v("fTel"),neg=v("fNeg"),fpago=PAGO[MODO];
  if(!calc().t||!nombre||!dir||!fpago||(may&&!tel)){$("err").style.display="block";return;}
  var o=may?enviarMay(nombre,neg,dir,tel,fpago):enviarMin(nombre,dir,tel,fpago);
  if(window._guardarPendienteCliente)window._guardarPendienteCliente(o.pend);
  window.open("https://wa.me/"+WA_NUM+"?text="+encodeURIComponent(o.m),"_blank");
  abrir("hoja",false);PED[MODO]={};ped=PED[MODO];PAGO[MODO]="";$("hCuerpo").innerHTML="";render();
  $("listoNom").textContent="Hola, "+nombre+" 👋";$("listoTot").textContent="Total del pedido: "+fmt(o.t);$("listo").classList.add("on");}

/* ===== Eventos ===== */
document.addEventListener("click",function(e){
  var z=e.target.closest("[data-zoom]");if(z){var tz=$("togoZoom");if(!tz){tz=document.createElement("div");tz.id="togoZoom";tz.onclick=function(){tz.style.display="none";};tz.appendChild(document.createElement("img"));document.body.appendChild(tz);}tz.firstChild.src=z.dataset.zoom;tz.style.display="flex";return;}
  var a=e.target.closest("[data-a],[data-m],[data-ir],[data-ped],[data-pago],[data-modo],#bWa");if(!a)return;
  if(a.dataset.a){cambia(a.dataset.a,1);render();if($("hoja").classList.contains("on"))hoja();}
  else if(a.dataset.m){cambia(a.dataset.m,-1);render();if($("hoja").classList.contains("on"))hoja();}
  else if(a.dataset.modo)cambiarModo(a.dataset.modo);
  else if(a.dataset.ir)ir(a.dataset.ir);
  else if(a.dataset.ped){abrir("menu",false);verPed();}
  else if(a.dataset.pago){PAGO[MODO]=a.dataset.pago;document.querySelectorAll(".pago").forEach(function(b){b.classList.toggle("on",b.dataset.pago===PAGO[MODO]);});if($("err"))$("err").style.display="none";}
  else if(a.id==="bWa")enviar();});
document.addEventListener("input",function(e){if(e.target.id==="q"){q=e.target.value;render();}else if($("err"))$("err").style.display="none";});
$("bMenu").onclick=function(){abrir("menu",true);};
$("velo").onclick=function(){abrir("menu",false);abrir("hoja",false);};
$("bCerrar").onclick=function(){abrir("hoja",false);};
$("bVer").onclick=verPed;$("bCarro").onclick=verPed;
$("bListo").onclick=function(){$("listo").classList.remove("on");window.scrollTo({top:0});};
armar();marco();render();
})();
</script>
</body>
