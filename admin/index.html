<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administración FRIOTEKA</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF0F5;--card:#fff;--tx:#14212b;--mut:#5b6b78;--line:#dbe3ea;--acc:#0e7490;
  --banda:#0b2530;--banda2:#123543;--bandaTx:#eef6f9;--bandaMut:#9fb8c4;
  --cian:#0891b2;--naranja:#ea580c;--verde:#15803d;--violeta:#7c3aed;--coral:#e8594a;--amarillo:#b7860b;
  --verde2:#86c79a;--bar:var(--area,#0891b2);--plan:#c3ced8;
  --red:#c62828;--redbg:#fdecea;--yel:#8a5d00;--yelbg:#fff3d1;--ok:#15803d;
  --area:var(--cian);
  --fT:"Bricolage Grotesque",system-ui,sans-serif;--fS:"IBM Plex Sans",system-ui,sans-serif;--fM:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0c161d;--card:#15232d;--tx:#e6eef3;--mut:#93a6b3;--line:#253844;--acc:#22d3ee;
  --banda:#06131a;--banda2:#0f2631;
  --cian:#22d3ee;--naranja:#fb923c;--verde:#4ade80;--violeta:#a78bfa;--coral:#ff8a7a;--amarillo:#facc15;
  --verde2:#1f6b3a;--plan:#3a4b58;
  --red:#ff7b72;--redbg:#3a1d1d;--yel:#e3b341;--yelbg:#3a321b;--ok:#4ade80;
}}
[data-area="gastos"],[data-area="energia"]{--area:var(--naranja)}
[data-area="bancos"]{--area:var(--cian)}
[data-area="empleados"]{--area:var(--violeta)}
[data-area="impuestos"],[data-area="iva"]{--area:var(--coral)}
[data-area="fenovo"],[data-area="proveedores"]{--area:var(--amarillo)}
[data-area="almacen"]{--area:var(--verde)}
[data-area]{--bar:var(--area)}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 var(--fS)}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px 24px}
h1,h2{font-family:var(--fT);letter-spacing:-.01em}
h1{margin:2px 0 0;font-size:24px;font-weight:700}
h2{font-size:17px;font-weight:650;margin:22px 0 10px}
/* Banda oscura de arriba */
header{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-start;justify-content:space-between;
  margin:0 calc(50% - 50vw) 16px;padding:18px max(16px,calc(50vw - 534px)) 18px;background:linear-gradient(180deg,var(--banda),var(--banda2));color:var(--bandaTx)}
header .crumb{color:var(--bandaMut);font-size:13px}.crumb a{color:inherit;text-decoration:underline;text-underline-offset:3px}
header h1{color:#fff}
header .lect{color:var(--bandaMut)}
header .btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);color:#fff}
header > .grid.kpis{flex-basis:100%;margin-top:6px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
header .card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-left:4px solid var(--c,var(--area));color:var(--bandaTx)}
header .lbl,header .sub{color:var(--bandaMut)}
header .big{color:#fff}
header .neg{color:#ff9a8f}header .pos{color:#7ee0a0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:-4px 0 14px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--tx);text-decoration:none;font-size:14px;font-weight:500}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.btn{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:9px;padding:8px 12px;font:500 14px var(--fS);cursor:pointer}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-size:16px;padding:12px 18px}
.lect{color:var(--mut);font-size:12px;margin-top:6px;text-align:right}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.areas{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media (max-width:760px){.two{grid-template-columns:minmax(0,1fr)}.kpis,header > .grid.kpis{grid-template-columns:1fr 1fr}header .lect{text-align:left}}
@media (max-width:420px){.kpis{grid-template-columns:1fr}header > .grid.kpis{grid-template-columns:1fr 1fr;gap:8px}header .card{padding:10px 11px}header .big{font-size:18px}header .sub{font-size:11.5px}header .lbl{font-size:12px}h1{font-size:21px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.lbl{color:var(--mut);font-size:13px}
.big{font:600 25px/1.2 var(--fM);margin:4px 0;letter-spacing:-.02em}
.sub{color:var(--mut);font-size:13px}
.area{display:block;text-decoration:none;color:var(--tx);font-weight:600;font-size:16px;padding:18px 14px}
.area small{display:block;color:var(--mut);font-weight:400;font-size:12px;margin-top:2px}
.area.off{opacity:.45;pointer-events:none}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mut);font-weight:500;font-size:12px}
.n{text-align:right;white-space:nowrap;font-family:var(--fM);font-size:13.5px}
tr.det td{color:var(--mut);font-size:13px;background:var(--bg)}
tr.fila{cursor:pointer}
.rub{display:grid;grid-template-columns:130px 1fr 120px;gap:8px;align-items:center;margin:7px 0;font-size:14px}
.track{background:var(--line);border-radius:4px;height:12px}
.fill{background:var(--bar);height:12px;border-radius:4px}
.al{border-radius:10px;padding:9px 12px;margin:6px 0;font-size:14px}
.r{background:var(--redbg);color:var(--red)}
.y{background:var(--yelbg);color:var(--yel)}
ul{margin:4px 0;padding-left:18px}li{margin:3px 0}
.src{color:var(--mut);font-size:12px;margin-top:8px}
.centro{max-width:460px;margin:60px auto;text-align:center}
.centro p{color:var(--mut)}
.neg{color:var(--red)}
.pos{color:var(--ok)}
.fill.in{background:var(--ok)}
tr.ver td{color:var(--yel)}
:root{--neg2:#8a6fd1}
@media (prefers-color-scheme:dark){:root{--neg2:#9d86e0}}
.stack{display:flex;height:14px;border-radius:4px;overflow:hidden;gap:2px}
.stack .b{background:var(--bar)}.stack .nn{background:var(--neg2)}
.tag{display:inline-block;font-size:12px;border-radius:10px;padding:1px 8px}
.tag.r{background:var(--redbg);color:var(--red)}.tag.y{background:var(--yelbg);color:var(--yel)}.tag.g{background:var(--line);color:var(--mut)}
.up{color:var(--red);font-weight:600}
.dia{font-weight:600;white-space:nowrap}
.debe{color:var(--red);font-size:13px}
.rub2{display:grid;grid-template-columns:minmax(150px,260px) 1fr 110px;gap:8px;align-items:center;margin:8px 0;font-size:14px}
.tag.m{background:#e3f1e8;color:#1f6b3a}.tag.e{background:var(--yelbg);color:var(--yel)}
@media (prefers-color-scheme:dark){.tag.m{background:#1d3326;color:#7dd3a0}}
@media (max-width:600px){.rub,.rub2{grid-template-columns:1fr 90px}.rub .track,.rub2 .track{grid-column:1/-1;order:3}}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.btn.on{background:var(--acc);border-color:var(--acc);color:#fff}
details summary{cursor:pointer;font-size:14px}
.sem{display:grid;grid-template-columns:90px 1fr 120px;gap:8px;align-items:center;margin:8px 0;font-size:13px}
.par{display:flex;flex-direction:column;gap:3px}
.b{height:10px;border-radius:3px}
.b.plan{background:var(--plan)}
.b.real{background:var(--bar)}
.b.real.mal{background:var(--red)}
.ley{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--mut);margin-bottom:8px}
.ley i{display:inline-block;width:12px;height:10px;border-radius:2px;margin-right:4px;vertical-align:middle}
.split{display:flex;height:14px;border-radius:4px;overflow:hidden;margin:8px 0 4px;gap:2px}
/* Gráficos */
.graf h3{font:650 16px/1.3 var(--fT);margin:0 0 2px}
.graf .que{color:var(--mut);font-size:12.5px;margin-bottom:10px}
.cols{position:relative;display:flex;align-items:flex-end;gap:2px;height:190px;padding-top:6px;border-bottom:1px solid var(--line)}
.cols .col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;cursor:pointer;min-width:0}
.cols .col span{display:block;width:100%}
.cols .col span:first-child{border-radius:3px 3px 0 0}
.cols .col.vacio{cursor:default}
.cols .col:hover span,.cols .col.sel span{filter:brightness(1.12)}
.meta{position:absolute;left:0;right:0;border-top:2px dashed var(--tx);opacity:.55;pointer-events:none}
.meta b{position:absolute;right:0;top:-18px;font:500 11px var(--fS);background:var(--card);padding:0 4px;opacity:1}
.ejeX{display:flex;gap:2px;font:11px var(--fM);color:var(--mut);margin-top:4px}
.ejeX span{flex:1;text-align:center;min-width:0;white-space:nowrap;overflow:visible}
.hbar{display:grid;grid-template-columns:minmax(110px,150px) 1fr 90px;gap:8px;align-items:center;margin:6px 0;font-size:14px;cursor:pointer}
.hbar .track{height:14px;background:transparent}
.hbar .fill{height:14px;border-radius:0 4px 4px 0;background:var(--c,var(--bar))}
.hbar .n{color:var(--tx)}
.bullet{position:relative;height:22px;background:var(--line);border-radius:6px;margin:10px 0 4px;cursor:pointer}
.bullet .v{position:absolute;left:0;top:4px;bottom:4px;border-radius:0 4px 4px 0;background:var(--coral)}
.bullet .v.mal{background:var(--red)}
.bullet .t{position:absolute;top:-4px;bottom:-4px;border-left:3px solid var(--tx)}
svg text{font-family:var(--fM)}
#tip{position:fixed;z-index:9;pointer-events:none;background:var(--tx);color:var(--card);font:500 13px/1.35 var(--fS);padding:7px 10px;border-radius:8px;max-width:260px;box-shadow:0 4px 14px rgba(0,0,0,.2);display:none}
#tip b{font-family:var(--fM)}
</style>
</head>
<body>
<div id="tip"></div>
<div class="wrap" id="app"><div class="centro"><p>Cargando…</p></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script type="module">
import { requireLogin } from "../login.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, setPersistence, browserSessionPersistence, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

// ---------- Quién puede entrar (usuario de las apps, sin @frioteka.app) ----------
const USUARIOS = ["esteban"];

// ---------- Login (el mismo Firebase de las apps) ----------
const fbApp = initializeApp({
  apiKey: "AIzaSyC5voDKO_imN8QqRRpjMQdwV7QILrJw40g",
  authDomain: "frioteka-preventista.firebaseapp.com",
  projectId: "frioteka-preventista",
  storageBucket: "frioteka-preventista.firebasestorage.app",
  messagingSenderId: "212598423220",
  appId: "1:212598423220:web:aee51bc39626b3c08621e1"
}, "admin");
const auth = getAuth(fbApp);
await setPersistence(auth, browserSessionPersistence); // la sesión se cierra al cerrar Chrome
await requireLogin(fbApp, { color: "#1f3a5f", titulo: "Administración FRIOTEKA" });
window.salir = async () => { await signOut(auth); location.reload(); };
if (!USUARIOS.includes(window.FRIO_USUARIO)) {
  document.getElementById("app").innerHTML = `<div class="centro"><h1>No tenés acceso</h1><p>El usuario "${String(window.FRIO_USUARIO).replace(/[<>&"]/g, "")}" no puede ver el sistema de administración.</p><button class="btn pri" onclick="salir()">Salir</button></div>`;
  throw new Error("sin acceso");
}

// ---------- Archivos: se leen de la carpeta TODO CLAUDE de esta PC, nunca se escriben ----------
const RUTA = {
  gastos: "GASTOS FIJOS Y VARIABLES/GASTOS.xlsx",
  ventas: m => `JORNADAS/${MESES[m.getMonth()]}_CLAUDE.xlsx`,
  cierre: ym => `PANORAMA GENERAL/CIERRES/${ym}/CIERRE_GASTOS_${ym}.json`,
  bancos: "BANCOS/BANCOS.xlsx",
  fenovo: "FENOVO/FRIOTEKA_Fenovo.xlsx",
  proveedores: "PROVEEDORES/FRIOTEKA_Proveedores.xlsx",
  visitas: "_CIRCUITO/VISITAS_PROVEEDORES.xlsx",
  almacen: "COMPRAS ALMACEN/COMPRAS_ALMACEN.xlsx",
  inventarioLuz: "ENERGIA CARCANO/INVENTARIO_CONSUMO_CARCANO.xlsx",
  sueldos: "EMPLEADOS/RESUMEN_SUELDOS.xlsx",
  cierreB: ym => `PANORAMA GENERAL/CIERRES/${ym}/CIERRE_BANCOS_${ym}.json`,
  impuestos: "PANORAMA GENERAL/IMPUESTOS_MES.xlsx"
};
const MESES = ["ENERO","FEBRERO","MARZO","ABRIL","MAYO","JUNIO","JULIO","AGOSTO","SEPTIEMBRE","OCTUBRE","NOVIEMBRE","DICIEMBRE"];
const $app = document.getElementById("app");

function idb() {
  return new Promise((ok, mal) => { const r = indexedDB.open("ftk-admin", 1); r.onupgradeneeded = () => r.result.createObjectStore("k"); r.onsuccess = () => ok(r.result); r.onerror = () => mal(r.error); });
}
async function guardarCarpeta(h) { const db = await idb(); await new Promise(ok => { const t = db.transaction("k", "readwrite"); t.objectStore("k").put(h, "carpeta"); t.oncomplete = ok; }); }
async function cargarCarpeta() { try { const db = await idb(); return await new Promise(ok => { const q = db.transaction("k").objectStore("k").get("carpeta"); q.onsuccess = () => ok(q.result || null); q.onerror = () => ok(null); }); } catch { return null; } }

let carpeta = null;
async function archivo(ruta) {
  if (window.__leerPrueba) return window.__leerPrueba(ruta);
  let d = carpeta; const partes = ruta.split("/"); const nombre = partes.pop();
  for (const p of partes) d = await d.getDirectoryHandle(p);
  const f = await (await d.getFileHandle(nombre)).getFile();
  return { buf: await f.arrayBuffer(), mod: new Date(f.lastModified) };
}
async function libro(ruta) { const a = await archivo(ruta); return { wb: XLSX.read(a.buf, { type: "array" }), mod: a.mod }; }

// Grilla con posiciones reales (fila 1 = índice 0, columna A = índice 0)
function grilla(ws) {
  const R = XLSX.utils.decode_range(ws["!ref"] || "A1"), g = [];
  for (let r = 0; r <= R.e.r; r++) { const fila = []; for (let c = 0; c <= R.e.c; c++) { const x = ws[XLSX.utils.encode_cell({ r, c })]; fila.push(x ? x.v : null); } g.push(fila); }
  return g;
}
const txt = v => (v == null ? "" : String(v)).trim();
const num = v => (typeof v === "number" ? v : null);
const norm = s => txt(s).toUpperCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const fecha = s => { const d = new Date(Math.round((s - 25569) * 864e5)); return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()); };
const dm = d => d.toLocaleDateString("es-AR", { day: "2-digit", month: "2-digit" });
const $ = n => n == null ? "—" : Math.round(n).toLocaleString("es-AR");
const pesos = n => n == null ? "sin dato" : (n < 0 ? "−$ " : "$ ") + $(Math.abs(n));
const pct = n => n == null || !isFinite(n) ? "—" : (n * 100).toLocaleString("es-AR", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + " %";
const esc = s => txt(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const ym = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
function fechaTexto(t, hoy) { // "10/12/2026" o "13/12"
  const m = txt(t).match(/(\d{1,2})\/(\d{1,2})(?:\/(\d{4}))?/); if (!m) return null;
  let a = m[3] ? +m[3] : hoy.getFullYear(); const f = new Date(a, +m[2] - 1, +m[1]);
  if (!m[3] && f < new Date(hoy.getFullYear(), hoy.getMonth() - 6, 1)) f.setFullYear(a + 1);
  return f;
}

// ---------- Lectura de GASTOS.xlsx (por rótulos, no por número de fila) ----------
function leerHoja1(g) {
  const lados = { sm: { lbl: 2, val: 1 }, carcano: { lbl: 6, val: 5 } }, out = {}, avisos = [], planesHoja1 = new Set();
  for (const [k, { lbl, val }] of Object.entries(lados)) {
    const v = r => { for (const f of g) if (norm(f[lbl]) === r) { if (num(f[val]) == null) avisos.push(`Hoja1: "${r}" sin valor guardado (abrir y guardar GASTOS.xlsx en Excel)`); return num(f[val]) ?? 0; } avisos.push(`Hoja1: no encontré "${r}" (${k === "sm" ? "San Martín" : "Cárcano"})`); return 0; };
    const total = v("TOTAL GASTOS"), alq = v("TOTAL ALQUILER"), sue = v("TOTAL SUELDOS"), apo = v("TOTAL APORTES"), luz = v("TOTAL EPEC"), var_ = v("TOTAL VARIOS"), flete = v("FLETE FENOVO");
    // Planes de IIBB que Gastos ya suma dentro de TOTAL VARIOS (renglones "PLAN A IIBB", "PLAN B IIBB"): no se vuelven a sumar desde IMPUESTOS
    let planes = 0; for (const f of g) { const p = norm(f[lbl]).match(/^PLAN ([A-Z]) IIBB/); if (p && num(f[val]) != null) { planes += num(f[val]); planesHoja1.add(p[1]); } }
    out[k] = { total, sueldos: sue, planes, rubros: { "Luz": luz, "Alquileres": alq, "Sueldos y cargas": sue + apo, "Servicios": var_ - flete - planes, "Flete Fenovo": flete } };
    const suma = alq + sue + apo + luz + var_;
    if (Math.abs(suma - total) > 1) avisos.push(`Hoja1 ${k === "sm" ? "San Martín" : "Cárcano"}: los rubros suman ${$(suma)} pero el TOTAL GASTOS dice ${$(total)}`);
  }
  // Gestión: el monto está escrito en el rótulo ("BANCHI 2M", "FERNANDA (2M ...")
  let gestion = 0, nGest = 0;
  // El rótulo puede estar en B (monto en el texto) o en C con el monto como número en B (así desde el 24/11)
  for (const f of g) {
    const t = [txt(f[1]), txt(f[2])].find(s => /^GESTION\s*-/i.test(norm(s))); if (!t) continue;
    const m = t.match(/(\d+(?:[.,]\d+)?)\s*M\b/), monto = num(f[1]) ?? (m ? parseFloat(m[1].replace(",", ".")) * 1e6 : null);
    if (monto != null) { gestion += monto; nGest++; }
  }
  if (nGest !== 2) avisos.push(`Hoja1: encontré ${nGest} sueldos de gestión (esperaba 2)`);
  // Vencimientos anotados en Hoja1 ("a pagar hasta 30/11", "VEP expira 13/12")
  const notas = [];
  for (const f of g) { const m = txt(f[5]).match(/(?:a pagar hasta|expira)\s+(\d{1,2}\/\d{1,2})/i); if (m && num(f[2]) != null) notas.push({ que: txt(f[1]), monto: f[2], fechaTxt: m[1], nota: txt(f[5]) }); }
  return { ...out, gestion, notas, avisos, planesHoja1 };
}

function leerImpuestos(g, mes, hoy, enHoja1 = new Set()) {
  const avisos = [], planes = {}, alertas = [], proximos = [];
  const mesAnt = new Date(mes.getFullYear(), mes.getMonth() - 1, 1);
  const perAnt = `${String(mesAnt.getMonth() + 1).padStart(2, "0")}/${mesAnt.getFullYear()}`;
  let muni = null;
  for (const f of g) {
    const per = txt(f[0]), imp = norm(f[1]);
    if (/^\d{2}\/\d{4}$/.test(per) && imp.startsWith("MUNICIPALIDAD")) {
      const aPagar = num(f[8]) ?? 0, pagada = /PAGAD/i.test(txt(f[11]) + " " + txt(f[12]));
      if (per === perAnt) muni = aPagar;
      if (aPagar > 0 && !pagada && num(f[10]) != null) {
        const v = fecha(f[10]);
        if (v < hoy) alertas.push({ t: "r", h: `<b>Vencida:</b> Municipalidad ${per} · $ ${$(aPagar)} · vencía ${dm(v)} y no figura pagada.` });
        else proximos.push({ f: v, h: `Municipalidad ${per} · $ ${$(aPagar)}` });
      }
    }
    const pm = txt(f[0]).match(/^([A-Z])\s*\(\d+\s*cuotas\)/i);
    if (pm && num(f[1]) != null) {
      const p = planes[pm[1]] ||= { cuotas: [], obs: "" };
      p.cuotas.push({ n: f[1], venc: txt(f[2]), monto: num(f[3]) ?? 0, estado: txt(f[4]) }); p.obs = txt(f[5]);
    }
    if (norm(f[0]) === "TOTAL VENCIDO" && num(f[5])) alertas.push({ t: "r", h: `<b>Vencida:</b> deuda Municipalidad de meses anteriores · $ ${$(f[5])} (dato del portal; crece con recargos).` });
  }
  if (muni == null) { avisos.push(`IMPUESTOS: no está la Municipalidad del período ${perAnt}`); muni = 0; }

function leerVentas(g, mes) {

const CUENTAS = [["BANCOR", "Bancor"], ["FRANCES", "Francés"], ["MERCADO PAGO", "Mercado Pago"], ["MACRO", "Macro"]];

function leerEcheqs(g) {

async function calcularBancos(hoy, mes, F) {

  for (let i = hi + 1; hi >= 0 && i < gi.length; i++) { const f = gi[i]; if (num(f[0]) == null || num(f[3]) == null) continue; tandas.push({ d: fecha(f[0]), interes: f[3], tasa: parseFloat((txt(f[9]).match(/([\d]+[,.]?\d*)\s*%\s*mensual/i) || [])[1]?.replace(",", ".")) }); }
  const intMes = tandas.filter(t => t.d >= mes).reduce((a, t) => a + t.interes, 0);
  const conTasa = tandas.filter(t => !isNaN(t.tasa)), ult = conTasa[conTasa.length - 1], ant = conTasa[conTasa.length - 2];

  if (res.usado > 0) alertas.push({ t: "y", h: `<b>Apartado para Fenovo:</b> debería haber ${pesos(res.apartado)}; se usaron ${pesos(res.usado)} para otra cosa.` });
  return { mod: F.mod, deudaTotal, excInicio, excHoy, atraso, intPlan, inicioPlan, semanasPlan, res, ccMes, ccAnt, intMes, echeqs, sumaE, en30, porMes, alertas, avisos };

// ---------- IVA: GASTOS (DDJJ e historial), JORNADAS (débito), Fenovo y Proveedores (crédito) ----------
const MESC = ["ENE", "FEB", "MAR", "ABR", "MAY", "JUN", "JUL", "AGO", "SEP", "OCT", "NOV", "DIC"];
const etiqueta = d => `${MESC[d.getMonth()]}-${String(d.getFullYear()).slice(2)}`;
const periodo = d => `${String(d.getMonth() + 1).padStart(2, "0")}/${d.getFullYear()}`;
function col(hdr, ...nombres) { return hdr.findIndex(h => nombres.some(n => norm(h).startsWith(n))); }
function calcularIva(x, F, P) {

  if (i0 < 0) avisos.push('GASTOS.xlsx › IMPUESTOS: no encontré el bloque "IVA MENSUAL"');

  // Historial del estudio

  for (let i = h0 + 2; h0 >= 0 && i < g.length && txt(g[i][0]); i++) { const f = g[i]; if (num(f[1]) == null) continue; hist.push({ mes: txt(f[0]), deb: f[1], cred: num(f[2]), aFavor: num(f[5]), dif: num(f[6]) ?? (num(f[2]) ?? 0) - f[1], version: /\(v\d\)/i.test(txt(f[0])) }); }
  // Débito del mes (ventas) y crédito del mes (Fenovo + Proveedores)
  const iv = x.ve?.iva; if (!iv?.ok) avisos.push("JORNADAS: no encontré las columnas IVA 10,5% / IVA 21%");
  const debito = iv?.ok ? iv.i105 + iv.i21 : null;
  let fen = { iva: 0, per: 0 }, prov = { iva: 0, per: 0, n: 0 };
  try { const gf = grilla(F.wb.Sheets["IVA"]), hi = gf.findIndex(f => norm(f[0]) === "MES"), hdr = gf[hi], ci = col(hdr, "IVA CREDITO FISCAL"), cp = col(hdr, "PERCEPCION IVA");
    for (const f of gf.slice(hi + 1)) { const d = aFecha(f[0]); if (d && d.getFullYear() === x.mes.getFullYear() && d.getMonth() === x.mes.getMonth()) fen = { iva: num(f[ci]) ?? 0, per: num(f[cp]) ?? 0 }; }
  } catch { avisos.push("FRIOTEKA_Fenovo.xlsx: no pude leer la hoja IVA"); }
  try { const gp = grilla(P.wb.Sheets["Compras"]), hdr = gp[0], cfc = col(hdr, "FECHA COMPROBANTE"), cfp = col(hdr, "FECHA PAGO"), cco = col(hdr, "CONDICION"), cpe = col(hdr, "PERCEP. IVA"), cic = col(hdr, "IVA CREDITO");
    if (cic < 0) throw 0;
    for (const f of gp.slice(1)) { const fc = num(f[cfc]) ?? num(f[cfp]); if (fc == null) continue; const d = fecha(fc); if (d.getFullYear() !== x.mes.getFullYear() || d.getMonth() !== x.mes.getMonth()) continue;
      const ic = num(f[cic]) ?? 0; if (ic > 0) { prov.iva += ic; prov.n++; if (norm(f[cco]) === "BLANCO") prov.per += num(f[cpe]) ?? 0; } }
  } catch { avisos.push(`No pude leer ${RUTA.proveedores} (hoja Compras)`); }
  const credito = fen.iva + fen.per + prov.iva + prov.per, dif = debito == null ? null : debito - credito;
  const saldo = ult?.aFavor ?? null, aPagar = dif == null || saldo == null ? null : Math.max(0, dif - saldo);
  // Mes anterior: DDJJ si está, si no el estimado del estudio
  const ddAnt = ddjj.find(d => d.per === periodo(mesAnt)), hAnt = hist.find(h => norm(h.mes).startsWith(etiqueta(mesAnt)));
  const ant = ddAnt ? { llevar: Math.max(0, (ddAnt.deb ?? 0) - (ddAnt.cred ?? 0)), fuente: "DDJJ" } : hAnt ? { llevar: Math.max(0, -(hAnt.dif ?? 0)), fuente: "estimado del estudio" } : null;
  if (!ddAnt && x.hoy.getDate() >= 15) alertas.push({ t: "r", h: `<b>DDJJ de IVA ${periodo(mesAnt)}:</b> no está cargada en GASTOS. Vence alrededor del 20 al 24 de este mes.` });
  if (ddjj.length) alertas.push({ t: "y", h: `<b>Transferido a Fenovo:</b> ${ddjj.map(d => `${d.per} ${d.aFenovo == null ? "sin cargar" : pesos(d.aFenovo)}`).join(" · ")}.` });

  if (ult) { const hu = hist.find(h => norm(h.mes).startsWith(etiqueta(new Date(+ult.per.slice(3), +ult.per.slice(0, 2) - 1, 1)))); if (hu && hu.aFavor != null && Math.abs(hu.aFavor - ult.aFavor) > 1e6) avisos.push(`El historial del estudio cierra ${ult.per} en ${pesos(hu.aFavor)} a favor; la DDJJ presentada, en ${pesos(ult.aFavor)}. Vale la DDJJ.`); }

  const filas = [];

  for (const d of ddjj) if (!filas.some(f => f.per === d.per)) filas.push({ mes: `${d.per} (DDJJ)`, deb: d.deb, cred: d.cred, dif: (d.cred ?? 0) - (d.deb ?? 0), aFavor: d.aFavor, ddjj: true, per: d.per });
  if (debito != null) filas.push({ mes: `${etiqueta(x.mes).toLowerCase()} (al ${x.ve?.ultimo ? dm(x.ve.ultimo) : "—"}, sistema)`, deb: debito, cred: credito, dif: -dif, aFavor: null });

}

// ---------- Impuestos (IVA + IIBB): PANORAMA GENERAL › IMPUESTOS_MES.xlsx, lo arma PANORAMA cada lunes ----------
const IMP_COLS = ["fecha_informe", "periodo_desde", "periodo_hasta", "local", "iva_debito", "iva_credito_fenovo", "iva_credito_proveedores", "iva_percepciones", "iva_saldo_mes", "iva_a_favor_acumulado", "iva_a_fenovo_estimado", "iibb_alicuota", "iibb_impuesto", "iibb_sircreb", "iibb_ret_payway_mp", "iibb_percepciones", "iibb_diferencia_mes", "iibb_a_favor_acumulado", "faltantes"];
function fechaImp(v) {
  if (typeof v === "number") return fecha(Math.round(v)); // número de fecha de Excel, redondeado al día
  if (v instanceof Date) { const d = new Date(v.getTime() + 12 * 36e5); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); } // redondea al día más cercano (fechas guardadas a medianoche UTC)
  const t = txt(v), iso = t.match(/^(\d{4})-(\d{2})-(\d{2})/); if (iso) return new Date(+iso[1], +iso[2] - 1, +iso[3]);
  const m = t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); return m ? new Date(+m[3], +m[2] - 1, +m[1]) : null;
}
function numImp(v) {
  if (typeof v === "number") return v;
  const t = txt(v).replace(/[$\s]/g, ""); if (!t) return null;
  const n = Number(/,\d+$/.test(t) ? t.replace(/\./g, "").replace(",", ".") : t.replace(/,/g, "")); return isFinite(n) ? n : null;
}
function calcularImpuestos(IM, hoy) {
  if (!IM) return { espera: true };
  const ws = IM.wb.Sheets[IM.wb.SheetNames[0]]; if (!ws) throw new Error("el archivo no tiene hojas");
  const g = grilla(ws), hdr = (g[0] || []).map(h => txt(h).toLowerCase()), C = {}, avisos = [];
  for (const c of IMP_COLS) { C[c] = hdr.indexOf(c); if (C[c] < 0) avisos.push(`IMPUESTOS_MES.xlsx: no encontré la columna "${c}"`); }
  if (C.fecha_informe < 0 || C.local < 0) throw new Error('faltan las columnas "fecha_informe" o "local"');
  const cual = l => { const n = norm(l); return n.includes("CARCANO") ? "carcano" : n.includes("SAN MARTIN") || n === "SM" ? "sm" : n.includes("TOTAL") ? "total" : null; };
  const porFecha = new Map();
  for (const f of g.slice(1)) {
    const fi = fechaImp(f[C.fecha_informe]), loc = cual(f[C.local]); if (!fi || !loc) { if (txt(f[C.local]) || txt(f[C.fecha_informe])) avisos.push(`IMPUESTOS_MES.xlsx: no entendí la fila "${txt(f[C.fecha_informe])} · ${txt(f[C.local])}"`); continue; }
    const v = {}; for (const c of IMP_COLS.slice(4, -1)) v[c] = C[c] < 0 ? null : numImp(f[C[c]]);
    v.desde = C.periodo_desde < 0 ? null : fechaImp(f[C.periodo_desde]); v.hasta = C.periodo_hasta < 0 ? null : fechaImp(f[C.periodo_hasta]);

  }

  const ult = informes[informes.length - 1];
  for (const k of ["carcano", "sm", "total"]) if (!ult.loc[k]) avisos.push(`IMPUESTOS_MES.xlsx: el informe del ${dm(ult.fi)} no tiene la fila de ${k === "sm" ? "San Martín" : k === "carcano" ? "Cárcano" : "Total"}`);
  // Saldo a favor de IIBB por semana (fila Total; si no está, Cárcano + San Martín)
  const favor = inf => inf.loc.total?.iibb_a_favor_acumulado ?? ((inf.loc.carcano?.iibb_a_favor_acumulado ?? null) == null && (inf.loc.sm?.iibb_a_favor_acumulado ?? null) == null ? null : (inf.loc.carcano?.iibb_a_favor_acumulado ?? 0) + (inf.loc.sm?.iibb_a_favor_acumulado ?? 0));
  const semanas = informes.map((inf, i) => { const v = favor(inf), p = i ? favor(informes[i - 1]) : null; return { fi: inf.fi, v, crece: v != null && p != null && v > p, cr: inf.loc.carcano?.iibb_a_favor_acumulado, sm: inf.loc.sm?.iibb_a_favor_acumulado }; });

  if (faltantes.length) alertas.push({ t: "r", h: `<b>Impuestos:</b> al informe del ${dm(ult.fi)} le faltan datos (${faltantes.map(f => f.n).join(", ")}). Ver el botón Impuestos.` });
  if (delta != null && delta > 0) alertas.push({ t: "y", h: `<b>IIBB a favor creció ${pesos(delta)}</b> en la última semana: es plata atrapada.` });
  if (viejo) alertas.push({ t: "y", h: `<b>Impuestos:</b> el último informe es del ${dm(ult.fi)} (más de una semana).` });
  return { mod: IM.mod, ult, semanas, delta, faltantes, viejo, alertas, avisos };
}

// ---------- Proveedores de almacén: hojas Compras y Precios de FRIOTEKA_Proveedores.xlsx ----------
function calcularProveedores(P, hoy, mes) {
  const hoja = n => { const ws = P.wb.Sheets[n]; if (!ws) throw new Error(`FRIOTEKA_Proveedores.xlsx no tiene la hoja ${n}`); return grilla(ws); };
  const g = hoja("Compras"), h = g[0], C = {};
  for (const [k, n] of [["fp", "FECHA PAGO"], ["fc", "FECHA COMPROBANTE"], ["pv", "PROVEEDOR"], ["comp", "COMPROBANTE"], ["cond", "CONDICION"], ["medio", "MEDIO DE PAGO"], ["tot", "TOTAL"], ["est", "ESTADO"], ["vence", "VENCE"], ["ivac", "IVA CREDITO"], ["per", "PERCEP. IVA"]]) { C[k] = col(h, n); if (C[k] < 0) throw new Error(`hoja Compras: no encontré la columna "${n}"`); }
  const mesAnt = new Date(mes.getFullYear(), mes.getMonth() - 1, 1), vacio = () => ({ t: 0, b: 0, n: 0, ef: 0, tr: 0, cc: 0, iva: 0, c: 0 });
  const meses = { act: vacio(), ant: vacio() }, semanasP = {}, prov = {}, pend = [], porDia = {};
  const lunes = d => { const l = new Date(d); l.setDate(d.getDate() - (d.getDay() + 6) % 7); return l; };
  for (const f of g.slice(1)) {
    const fn = num(f[C.fp]) ?? num(f[C.fc]), tot = num(f[C.tot]); if (fn == null || tot == null) continue;
    const d = fecha(fn), blanco = norm(f[C.cond]) === "BLANCO", pendiente = norm(f[C.est]) === "PENDIENTE", medio = norm(f[C.medio]);
    porDia[+d] = (porDia[+d] || 0) + tot;
    const m = d >= mes ? meses.act : d >= mesAnt ? meses.ant : null;
    if (m && d <= hoy) { m.t += tot; m.c++; blanco ? m.b += tot : m.n += tot; if (pendiente || !(medio.startsWith("EFECTIVO") || medio.startsWith("TRANSF"))) m.cc += tot; else if (medio.startsWith("EFECTIVO")) m.ef += tot; else m.tr += tot; m.iva += (num(f[C.ivac]) ?? 0) + (blanco ? num(f[C.per]) ?? 0 : 0); }
    if (m === meses.act && d <= hoy) prov[txt(f[C.pv])] = (prov[txt(f[C.pv])] || 0) + tot;
    const l = +lunes(d); (semanasP[l] ||= { d: new Date(l), b: 0, n: 0 })[blanco ? "b" : "n"] += tot;
    if (pendiente) { const fcv = num(f[C.fc]) ?? fn, v = num(f[C.vence]) != null ? fecha(f[C.vence]) : new Date(+fecha(fcv) + 7 * 864e5); pend.push({ v, pv: txt(f[C.pv]), comp: txt(f[C.comp]), blanco, tot, dias: Math.round((v - hoy) / 864e5) }); }
  }
  pend.sort((a, b) => a.v - b.v);
  const tramo = k => pend.filter(k).reduce((a, p) => a + p.tot, 0);
  const vencido = tramo(p => p.dias < 0), semana = tramo(p => p.dias >= 0 && p.dias <= 7), despues = tramo(p => p.dias > 7);
  const desde = +lunes(new Date(+hoy - 7 * 7 * 864e5)), sems = Object.values(semanasP).filter(s => +s.d >= desde && s.d <= hoy).sort((a, b) => a.d - b.d);
  // Precios que subieron en las últimas 2 semanas
  const gp = hoja("Precios"), hp = gp[0], cpv = col(hp, "PROVEEDOR"), cpr = col(hp, "PRODUCTO"), cul = col(hp, "ULTIMA COMPRA"), cne = col(hp, "PRECIO UNIT. NETO"), can = col(hp, "PRECIO NETO ANTERIOR"), cva = col(hp, "VARIACION");
  const subas = [], avisos = [];
  if ([cpv, cpr, cul, cne, can, cva].some(c => c < 0)) avisos.push("hoja Precios: faltan columnas, no se muestran las subas");
  else for (const f of gp.slice(1)) { const u = num(f[cul]), v = num(f[cva]); if (u == null || v == null || v <= 0) continue; const d = fecha(u); if (d >= new Date(+hoy - 14 * 864e5)) subas.push({ d, pv: txt(f[cpv]), pr: txt(f[cpr]), antes: num(f[can]), ahora: num(f[cne]), v }); }
  subas.sort((a, b) => b.v - a.v);
  const alertas = [];
  if (vencido > 0) alertas.push({ t: "r", h: `<b>Pagos a proveedores vencidos:</b> ${pesos(vencido)} (${[...new Set(pend.filter(p => p.dias < 0).map(p => p.pv))].join(", ")}).` });
  const top = Object.entries(prov).sort((a, b) => b[1] - a[1]).slice(0, 8);
  return { mod: P.mod, meses, porDia, pend, vencido, semana, despues, totalPend: vencido + semana + despues, sems, top, subas, alertas, avisos };
}

// ---------- Compras almacén: venta y costo de almacén (JORNADAS) contra lo comprado (Proveedores), visitas y cupo ----------
const DIAS = ["DOMINGO", "LUNES", "MARTES", "MIERCOLES", "JUEVES", "VIERNES", "SABADO"];
function calcularAlmacen(x, veAnt, VIS, CA) {
  const avisos = [], hoy = x.hoy, mesAnt = new Date(x.mes.getFullYear(), x.mes.getMonth() - 1, 1);
  const act = x.ve?.alm, ant = veAnt?.alm;
  if (!act?.ok) throw new Error("JORNADAS: no encontré las columnas TV ALMACEN / RG ALMACEN");
  if (!ant?.ok) avisos.push(`No pude leer la venta de almacén de ${MESES[mesAnt.getMonth()].toLowerCase()} (JORNADAS)`);
  const tot = a => ({ tv: a.sm.tv + a.carcano.tv, rg: a.sm.rg + a.carcano.rg });
  const tA = tot(act), tP = ant?.ok ? tot(ant) : null;
  const comp = x.p?.porDia || {}; if (x.p?.error) avisos.push("No pude leer lo comprado (Proveedores)");

  const compAct = compEntre(x.mes, hoy), compAnt = compEntre(mesAnt, new Date(+x.mes - 864e5));
  // Semanas desde el 1° del mes pasado
  const dias = { ...(ant?.dia || {}), ...act.dia }, sems = [];
  let l = new Date(mesAnt); l.setDate(l.getDate() - (l.getDay() + 6) % 7);
  while (l <= hoy) { const fin = new Date(+l + 6 * 864e5), desde = l < mesAnt ? mesAnt : l, hasta = fin > hoy ? hoy : fin;
    let costo = 0; for (const [k, v] of Object.entries(dias)) if (+k >= +desde && +k <= +hasta) costo += v.tv - v.rg;
    sems.push({ d: new Date(l), costo, comp: compEntre(desde, hasta) }); l = new Date(+l + 7 * 864e5); }
  const acum = sems.reduce((s, w) => s + w.comp - w.costo, 0);
  // Visitas de los próximos 7 días
  const visitas = [];
  try { const g = grilla(VIS.wb.Sheets["VISITAS"]), h = g[0], cp = col(h, "PROVEEDOR"), cd = col(h, "DIA DE VISITA");
    const deuda = {}; for (const q of x.p?.pend || []) { const e = deuda[q.pv] ||= { tot: 0, venc: 0, v: q.v }; e.tot += q.tot; if (q.dias < 0) e.venc += q.tot; if (q.v < e.v) e.v = q.v; }
    const lista = g.slice(1).filter(f => txt(f[cp])).map(f => { const t = txt(f[cd]), fuera = norm(t.replace(/\([^)]*\)/g, "")), notas = [...t.matchAll(/\(([^)]*)\)/g)].map(m => m[1]);
      return { pv: txt(f[cp]), dias: DIAS.map((d, i) => fuera.includes(d) ? i : -1).filter(i => i >= 0), nota: notas.join(" / ") }; });
    for (let i = 0; i < 7; i++) { const d = new Date(+hoy + i * 864e5), w = d.getDay(); const quien = lista.filter(p => p.dias.includes(w)).map(p => ({ ...p, deuda: deuda[p.pv] })); if (quien.length) visitas.push({ d, quien }); }
    const sinDia = lista.filter(p => !p.dias.length).length; if (sinDia) avisos.push(`${sinDia} proveedores tienen el día de visita "a confirmar" o "todos los días"`);
  } catch { avisos.push(`No pude leer ${RUTA.visitas}`); }
  // Cupo de la semana actual o la anterior
  let cupo = null;
  try { const g = grilla(CA.wb.Sheets["CUPO"]), h = g[0], cs = col(h, "SEMANA"), cp = col(h, "PROVEEDOR"), cc = col(h, "CUPO"), cb = col(h, "COMPRADO");
    const lunesHoy = new Date(hoy); lunesHoy.setDate(hoy.getDate() - (hoy.getDay() + 6) % 7);
    for (const lun of [lunesHoy, new Date(+lunesHoy - 7 * 864e5)]) { const filas = g.slice(1).filter(f => num(f[cs]) != null && +fecha(f[cs]) === +lun && num(f[cc]) != null);
      if (filas.length) { cupo = { semana: lun, filas: filas.map(f => ({ pv: txt(f[cp]), cupo: f[cc], comp: num(f[cb]) ?? 0 })).sort((a, b) => b.cupo - a.cupo) }; break; } }
  } catch { avisos.push(`No pude leer ${RUTA.almacen} (hoja CUPO)`); }
  const alertas = []; const ultSem = sems.filter(w => w.comp - w.costo > 1e6).pop();
  if (ultSem && hoy - ultSem.d < 14 * 864e5) alertas.push({ t: "y", h: `<b>Almacén:</b> la semana del ${dm(ultSem.d)} se compraron ${pesos(ultSem.comp - ultSem.costo)} más de lo vendido al costo.` });
  return { act, ant, tA, tP, compAct, compAnt, sems, acum, desde: mesAnt, visitas, cupo, alertas, avisos };
}

// ---------- Energía: boletas de GASTOS › EPEC e inventario de consumo de Cárcano ----------
function calcularEnergia(x, INV) {
  const avisos = [], alertas = [], proximos = [], hoy = x.hoy;
  const g = grilla(x.G.wb.Sheets["EPEC"]), h = g[0], C = {};
  for (const [k, n] of [["loc", "LOCAL"], ["emi", "EMISION"], ["ven", "VENCIMIENTO"], ["per", "PERIODO"], ["dias", "DIAS"], ["kwh", "KWH"], ["tot", "TOTAL"], ["real", "COSTO REAL"], ["est", "ESTADO"]]) C[k] = col(h, n);
  if (C.loc < 0 || C.kwh < 0 || C.tot < 0) throw new Error("GASTOS.xlsx › EPEC: faltan columnas (LOCAL, kWh o TOTAL)");
  const boletas = [];
  for (const f of g.slice(1)) {
    const loc = norm(f[C.loc]), kwh = num(f[C.kwh]), tot = num(f[C.tot]); if (!loc || kwh == null || tot == null) continue;
    const est = txt(f[C.est]), rec = est.match(/\+\s*\$?\s*([\d.]+(?:,\d+)?)\s*(?:de\s+)?recargo/i);
    const dias = num(f[C.dias]) ?? (txt(f[C.per]).match(/\((\d+)\s*d[ií]as\)/i) ? +txt(f[C.per]).match(/\((\d+)\s*d[ií]as\)/i)[1] : null);
    boletas.push({ local: loc === "CARCANO" ? "Cárcano" : loc === "SAN MARTIN" ? "San Martín" : txt(f[C.loc]), per: txt(f[C.per]), dias, kwh, tot, pk: tot / kwh, real: num(f[C.real]), ven: num(f[C.ven]) != null ? fecha(f[C.ven]) : null, emi: num(f[C.emi]) != null ? fecha(f[C.emi]) : null, pagada: /PAGAD/i.test(est), recargo: rec ? parseFloat(rec[1].replace(/\./g, "").replace(",", ".")) : 0, est });
  }
  boletas.sort((a, b) => (a.ven || a.emi || 0) - (b.ven || b.emi || 0));
  const locales = {}; for (const b of boletas) (locales[b.local] ||= []).push(b);
  const resumen = Object.entries(locales).map(([local, bs]) => { const u = bs[bs.length - 1], conDias = bs.filter(b => b.dias), a = conDias[conDias.length - 2], z = conDias[conDias.length - 1];
    const k = local === "Cárcano" ? "carcano" : local === "San Martín" ? "sm" : null, venta = k && x.veAnt ? x.veAnt[k] : null;
    return { local, u, cambio: a && z && z !== a ? (z.kwh / z.dias) / (a.kwh / a.dias) - 1 : null, porDiaAhora: z ? z.kwh / z.dias : null, porDiaAntes: a && a !== z ? a.kwh / a.dias : null, sobreVenta: venta ? u.tot / venta : null, venta }; });
  for (const b of boletas) if (!b.pagada && b.ven) { if (b.ven < hoy) alertas.push({ t: "r", h: `<b>Luz ${b.local} vencida sin pagar:</b> ${pesos(b.tot)} (vencía ${dm(b.ven)}).` }); else proximos.push({ f: b.ven, h: `Luz ${b.local} · $ ${$(b.tot)}` }); }
  const tarde = boletas.filter(b => b.recargo > 0); if (tarde.length) alertas.push({ t: "y", h: `<b>Se pagaron tarde:</b> ${tarde.length} boleta(s), ${pesos(tarde.reduce((s, b) => s + b.recargo, 0))} de recargos (${tarde.map(b => b.local + " " + pesos(b.recargo)).join(" · ")}).` });
  if ([10, 11, 0, 1].includes(hoy.getMonth())) alertas.push({ t: "y", h: `<b>Verano:</b> con el aire acondicionado la luz sube. Para comparar con el mismo mes del año pasado faltan las boletas viejas en la hoja EPEC de Gastos.` });
  // Inventario de consumo de Cárcano
  let inv = null;
  // Las columnas calculadas del Excel (horas, kWh, cuadre) son fórmulas sin resultado guardado:
  // la app hace la misma cuenta con lo que se carga a mano (kW, % del tiempo, horario de 24 h y parámetros de LEEME).
  try { const gc = grilla(INV.wb.Sheets["CARGAS"]), hi = gc.findIndex(f => norm(f[0]) === "ID"), hc = gc[hi];
    const cg = col(hc, "GRUPO"), ce = col(hc, "EQUIPO"), cq = col(hc, "CANT"), ck = col(hc, "KW DEL RENGLON"), co = col(hc, "ORIGEN"), cp = col(hc, "% DEL TIEMPO");
    // HORARIO: mismo orden de renglones que CARGAS (su columna ID también es fórmula sin resultado guardado)
    const gh = grilla(INV.wb.Sheets["HORARIO"]), hh = gh.findIndex(f => norm(f[0]) === "ID");
    const horasFila = i => { const f = gh[hh + (i - hi)]; return f ? f.slice(2, 26).reduce((s, v) => s + (num(v) ?? 0), 0) : 0; };
    if (hh < 0) avisos.push("Inventario: no encontré la hoja HORARIO con su encabezado");
    const L = porRotulo(grilla(INV.wb.Sheets["LEEME"])), diasMes = L("DIAS POR MES") || 30, pk = L("$ POR KWH"), kwhBol = L("KWH DE LA BOLETA"), diasBol = L("DIAS DE LA BOLETA"), sinFrio = L("SIN FRIO NI AIRE");
    const items = []; let baseKw = 0;
    for (let i = hi + 1; i < gc.length; i++) { const f = gc[i], id = txt(f[0]); if (!/^[A-Z]+\d+$|^AA$/.test(id)) continue; const kw = num(f[ck]); if (kw == null) continue;
      if (norm(f[cg]) === "BASE") baseKw += kw;
      const idH = txt(gh[hh + (i - hi)]?.[0]); if (idH && idH !== id) { avisos.push(`Inventario: HORARIO y CARGAS no están en el mismo orden (${id})`); continue; }
      const k = kw * horasFila(i) * (num(f[cp]) ?? 1) * diasMes; if (!k) continue;
      items.push({ eq: txt(f[ce]) + (num(f[cq]) > 1 ? ` (${f[cq]})` : ""), kwh: k, medido: /^MEDIDO/i.test(txt(f[co])) }); }
    const mes = kwhBol && diasBol ? kwhBol / diasBol * diasMes : null, cargado = items.reduce((s, i) => s + i.kwh, 0), kwSin = sinFrio != null ? sinFrio - baseKw : null;
    inv = { items: items.sort((a, b) => b.kwh - a.kwh), mes, cargado, resto: mes != null ? mes - cargado : null, kwSin, plataSin: kwSin != null && pk ? kwSin * 24 * diasMes * pk : null };
    if (inv.kwSin > 0.5) alertas.push({ t: "y", h: `<b>Cárcano: ${inv.kwSin.toLocaleString("es-AR", { maximumFractionDigits: 1 })} kW sin explicar</b> con todo el frío y el aire apagados. Si anduvieran las 24 h serían hasta ${pesos(inv.plataSin)} por mes. Lo está midiendo la conversación de Energía.` });
  } catch { avisos.push(`No pude leer ${RUTA.inventarioLuz}`); }
  return { boletas, resumen, inv, alertas, proximos, avisos };
}

// ---------- Empleados: RESUMEN_SUELDOS.xlsx (lo deja Empleados) + cargas sociales de GASTOS ----------
function aMes(v) { if (typeof v === "number") { const d = fecha(v); return new Date(d.getFullYear(), d.getMonth(), 1); } const m = txt(v).match(/(\d{1,2})\/(\d{4})/); return m ? new Date(+m[2], +m[1] - 1, 1) : null; }
// Sueldos reales del último mes cerrado (el más nuevo de MESES con 3 o más empleados), para el total de Gastos
function sueldosMesCerrado(RS) {
  const gm = grilla(RS.wb.Sheets["MESES"]), h = gm[0] || [], cm = col(h, "MES"), ce = col(h, "EMPLEADO"), ct = col(h, "TOTAL DEL MES");
  if (cm < 0 || ce < 0 || ct < 0) return null;
  const porMes = {}; for (const f of gm.slice(1)) { const m = aMes(f[cm]); if (m && txt(f[ce])) (porMes[+m] ||= []).push(num(f[ct]) ?? 0); }
  const k = Object.keys(porMes).map(Number).sort((a, b) => b - a).find(k => porMes[k].length >= 3);
  return k ? { m: new Date(k), tot: porMes[k].reduce((a, v) => a + v, 0) } : null;
}
function calcularEmpleados(x, RS) {
  const hoja = n => { const ws = RS.wb.Sheets[n]; if (!ws) throw new Error(`RESUMEN_SUELDOS.xlsx no tiene la hoja ${n}`); return grilla(ws); };
  const avisos = [], alertas = [];
  const gs = hoja("SEMANAS"), hs = gs[0], S = {};
  for (const [k, n] of [["sem", "SEMANA"], ["emp", "EMPLEADO"], ["tipo", "TIPO"], ["horas", "HORAS"], ["vh", "VALOR HORA"], ["gan", "TOTAL GANADO"], ["adel", "ADELANTOS"], ["cc", "CTA. CTE. DESCONTADA"], ["pag", "PAGADO"], ["pend", "PENDIENTE"], ["saldo", "SALDO CTA. CTE."]]) { S[k] = col(hs, n); if (S[k] < 0) throw new Error(`hoja SEMANAS: no encontré la columna "${n}"`); }
  const semanas = gs.slice(1).map(f => ({ d: aFecha(f[S.sem]), emp: txt(f[S.emp]), mensual: /MENSUAL/i.test(txt(f[S.tipo])), horas: num(f[S.horas]), vh: num(f[S.vh]), gan: num(f[S.gan]) ?? 0, adel: num(f[S.adel]) ?? 0, cc: num(f[S.cc]) ?? 0, pag: num(f[S.pag]), pend: num(f[S.pend]), saldo: num(f[S.saldo]) })).filter(s => s.d && s.emp);
  const gm = hoja("MESES"), hm = gm[0], Mc = {};
  for (const [k, n] of [["mes", "MES"], ["emp", "EMPLEADO"], ["rec", "NETO RECIBO"], ["fuera", "POR FUERA"], ["tot", "TOTAL DEL MES"], ["agui", "AGUINALDO"]]) { Mc[k] = col(hm, n); if (Mc[k] < 0) throw new Error(`hoja MESES: no encontré la columna "${n}"`); }
  const meses = gm.slice(1).map(f => ({ m: aMes(f[Mc.mes]), emp: txt(f[Mc.emp]), rec: num(f[Mc.rec]) ?? 0, fuera: num(f[Mc.fuera]) ?? 0, tot: num(f[Mc.tot]) ?? 0, agui: num(f[Mc.agui]) ?? 0 })).filter(r => r.m && r.emp);
  // Último mes cerrado = el más nuevo con al menos 3 empleados
  const porMes = {}; for (const r of meses) (porMes[+r.m] ||= []).push(r);
  const claves = Object.keys(porMes).map(Number).sort((a, b) => b - a), kc = claves.find(k => porMes[k].length >= 3);
  const cerrado = kc ? { m: new Date(kc), filas: porMes[kc] } : null;
  let res = null;
  if (cerrado) {
    const fin = new Date(cerrado.m.getFullYear(), cerrado.m.getMonth() + 1, 1), enMes = s => s.d >= cerrado.m && s.d < fin;
    const ccEmp = {}; for (const s of semanas.filter(enMes)) ccEmp[s.emp] = (ccEmp[s.emp] || 0) + s.cc;
    const sum = k => cerrado.filas.reduce((a, r) => a + r[k], 0);
    // Cargas sociales: los renglones CARGAS SOCIALES, CEC y FAECYS de GASTOS › Hoja1 (último período cargado)
    let cargas = 0; const g1 = grilla(x.G.wb.Sheets["Hoja1"]);
    for (const n of ["CARGAS SOCIALES", "CEC", "FAECYS"]) { const f = g1.find(f => norm(f[1]) === n && num(f[2]) != null); if (f) cargas += f[2]; else avisos.push(`GASTOS › Hoja1: no encontré "${n}"`); }
    const estimado = (x.h1?.sm?.sueldos ?? 0) + (x.h1?.carcano?.sueldos ?? 0);
    res = { rec: sum("rec"), fuera: sum("fuera"), tot: sum("tot"), agui: sum("agui"), cc: Object.values(ccEmp).reduce((a, v) => a + v, 0), ccEmp, cargas, estimado };
    if (estimado && res.tot > estimado * 1.1) alertas.push({ t: "y", h: `<b>Hoja1 de Gastos subestima los sueldos:</b> estima ${pesos(estimado)} por mes y ${MESES[cerrado.m.getMonth()].toLowerCase()} real fue ${pesos(res.tot)}. El total del sistema ya usa el real.` });
  }
  // Pendientes de pago y semanas sin montos
  for (const s of semanas) if (s.pend > 0) alertas.unshift({ t: "r", h: `<b>${esc(s.emp)}, ${s.mensual ? MESES[s.d.getMonth()].toLowerCase() : "semana del " + dm(s.d)}:</b> figura pendiente ${pesos(s.pend)}: falta registrar cómo y cuándo se pagó.` });
  const sinMontos = [...new Set(semanas.filter(s => !s.mensual && s.pag == null).map(s => +s.d))];
  for (const d of sinMontos) alertas.push({ t: "y", h: `<b>Semana del ${dm(new Date(d))}:</b> sin montos pagados cargados (${semanas.filter(s => +s.d === d && s.pag == null).map(s => esc(s.emp)).join(", ")}).` });
  // Último saldo de cuenta corriente de cada uno
  const empleados = [...new Set(semanas.map(s => s.emp))], saldo = {};
  for (const e of empleados) { const u = semanas.filter(s => s.emp === e && s.saldo != null).sort((a, b) => a.d - b.d).pop(); saldo[e] = u ? u.saldo : null; }
  // Horas de las últimas 6 semanas de los semanales
  const semsS = [...new Set(semanas.filter(s => !s.mensual).map(s => +s.d))].sort((a, b) => a - b).slice(-6), semanales = empleados.filter(e => semanas.some(s => s.emp === e && !s.mensual));
  const horas = semanales.map(e => ({ emp: e, vh: semanas.filter(s => s.emp === e && s.vh).sort((a, b) => a.d - b.d).pop()?.vh, celdas: semsS.map(d => { const s = semanas.find(s => s.emp === e && +s.d === d); return s ? { h: s.horas, inc: s.pag == null } : null; }) }));
  // Mes en curso
  const finAct = new Date(x.mes.getFullYear(), x.mes.getMonth() + 1, 1), act = semanas.filter(s => !s.mensual && s.d >= x.mes && s.d < finAct);
  const actual = { gan: act.reduce((a, s) => a + s.gan, 0), cc: act.reduce((a, s) => a + s.cc, 0), semanas: new Set(act.map(s => +s.d)).size, hasta: act.length ? new Date(Math.max(...act.map(s => +s.d)) + 6 * 864e5) : null, mensuales: (porMes[+x.mes] || []) };
  return { mod: RS.mod, cerrado, res, saldo, horas, semsS, actual, alertas, avisos };
}

// Metas: Cárcano $100M por mes (PANORAMA › OBJETIVOS); gasto sobre venta 20 % (Banchi 24/11/2026)
const META = { carcanoMes: 100e6, gastoVenta: 0.20 };
const COLOR_AREA = { bancos: "var(--cian)", gastos: "var(--naranja)", empleados: "var(--violeta)", impuestos: "var(--coral)", fenovo: "var(--amarillo)", proveedores: "var(--amarillo)", almacen: "var(--verde)", energia: "var(--naranja)" };
const Mm = n => n == null ? "—" : "$ " + (n / 1e6).toLocaleString("es-AR", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + "M";

// 1. Venta por día: Cárcano abajo (la meta es de Cárcano) y San Martín arriba
function grafVentas(x) {
  const ve = x.ve; if (!ve || !ve.dias) return `<div class="card graf"><h3>Venta por día</h3><div class="sub">Sin ventas cargadas este mes.</div></div>`;
  const dias = Array.from({ length: x.diasMes }, (_, i) => new Date(x.mes.getFullYear(), x.mes.getMonth(), i + 1));
  const metaDia = META.carcanoMes / x.diasMes, mx = Math.max(metaDia, ...dias.map(d => { const v = ve.porDia[+d]; return v ? v.sm + v.carcano : 0; })) * 1.08;
  const proy = ve.carcano / ve.dias * x.diasMes, dif = proy / META.carcanoMes - 1;
  const titulo = `Cárcano viene ${Math.abs(Math.round(dif * 100))} % ${dif < 0 ? "abajo" : "arriba"} de la meta`;
  const cols = dias.map(d => { const v = ve.porDia[+d]; if (!v) return `<div class="col vacio"></div>`;
    return `<div class="col"${tip(`${dm(d)} · Cárcano $ ${$(v.carcano)} · San Martín $ ${$(v.sm)} · Total $ ${$(v.carcano + v.sm)}`)}><span style="height:${v.sm / mx * 100}%;background:var(--verde2)"></span><span style="height:${v.carcano / mx * 100}%;background:var(--verde)"></span></div>`; }).join("");
  const eje = dias.map(d => `<span>${d.getDate() === 1 || d.getDate() % 10 === 0 ? d.getDate() : ""}</span>`).join("");
  return `<div class="card graf"><h3>${titulo}</h3>
    <div class="que">Proyectado ${Mm(proy)} contra ${Mm(META.carcanoMes)} en ${mesNom(x.mes).split(" ")[0].toLowerCase()} · venta por día, tocá una barra</div>
    <div class="ley"><span><i style="background:var(--verde)"></i>Cárcano</span><span><i style="background:var(--verde2)"></i>San Martín</span><span><i style="border-top:2px dashed var(--tx);height:0;width:14px"></i>Meta Cárcano por día (${Mm(metaDia)})</span></div>
    <div class="cols">${cols}<div class="meta" style="bottom:${metaDia / mx * 100}%"></div></div>
    <div class="ejeX">${eje}</div></div>`;
}

// 2. Gasto del mes por rubro (fijo por rubro + variables), de mayor a menor
function grafRubros(x) {

  const tot = r.reduce((a, [, v]) => a + v, 0), mx = r[0]?.[1] || 1;

  return `<div class="card graf"><h3>${r[0] ? `${r[0][0]} es el gasto más grande: ${p(r[0][1])} % del mes` : "Gastos del mes"}</h3>
    <div class="que">Gasto de ${mesNom(x.mes).split(" ")[0].toLowerCase()} por rubro · total ${pesos(tot)}</div>
    ${r.map(([n, v]) => `<div class="hbar"${tip(`${n}: $ ${$(v)} (${p(v)} % del gasto del mes)`)}><span>${esc(n)}</span><div class="track"><div class="fill" style="width:${v / mx * 100}%;--c:var(--naranja)"></div></div><span class="n">${Mm(v)}</span></div>`).join("")}</div>`;
}

// 3. Gasto sobre venta por mes contra la meta (meses cerrados + el actual, proporcional a los días con venta)
function grafPct(x) {
  const ser = [...x.historia, ...(x.pct != null ? [{ m: x.mes, pct: x.pct, actual: true }] : [])];
  if (!ser.length) return `<div class="card graf"><h3>Gasto sobre la venta</h3><div class="sub">Sin datos.</div></div>`;
  const u = ser[ser.length - 1], dif = u.pct - META.gastoVenta;
  const titulo = `${mesNom(u.m).split(" ")[0]} va ${pts(u.pct)} %: ${Math.abs(dif * 100).toLocaleString("es-AR", { maximumFractionDigits: 1 })} puntos ${dif > 0 ? "arriba" : "abajo"} de la meta`;
  const W = 320, H = 150, L = 34, R = 12, T = 12, B = 24;
  const vals = ser.map(s => s.pct), lo = Math.min(META.gastoVenta, ...vals) - 0.02, hi = Math.max(META.gastoVenta, ...vals) + 0.02;
  const X = i => ser.length === 1 ? (L + W - R) / 2 : L + 28 + i * (W - L - R - 56) / (ser.length - 1), Y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  const lineas = [lo, (lo + hi) / 2, hi].map(v => `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L - 4}" y="${Y(v) + 4}" font-size="10" text-anchor="end" fill="var(--mut)">${Math.round(v * 100)}%</text>`).join("");
  const path = ser.map((s, i) => `${i ? "L" : "M"}${X(i)},${Y(s.pct)}`).join("");
  const puntos = ser.map((s, i) => `<g${tip(`${mesNom(s.m)}: ${pts(s.pct)} % de la venta${s.actual ? " (va del mes, proporcional a los días con venta)" : " (cierre)"}`)} style="cursor:pointer"><circle cx="${X(i)}" cy="${Y(s.pct)}" r="14" fill="transparent"/><circle cx="${X(i)}" cy="${Y(s.pct)}" r="5" fill="${s.pct > META.gastoVenta ? "var(--red)" : "var(--naranja)"}" stroke="var(--card)" stroke-width="2"/></g><text x="${X(i)}" y="${H - 6}" font-size="10" text-anchor="middle" fill="var(--mut)">${MESC[s.m.getMonth()].toLowerCase()}${s.actual ? "*" : ""}</text><text x="${X(i)}" y="${Y(s.pct) - 10}" font-size="11" text-anchor="middle" fill="var(--tx)">${pts(s.pct)}</text>`).join("");
  return `<div class="card graf"><h3>${titulo}</h3>
    <div class="que">Gasto sobre la venta por mes · meta ${Math.round(META.gastoVenta * 100)} % · * mes en curso</div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(titulo)}">${lineas}
      <line x1="${L}" x2="${W - R}" y1="${Y(META.gastoVenta)}" y2="${Y(META.gastoVenta)}" stroke="var(--tx)" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="5 4"/>
      <text x="${W - R}" y="${Y(META.gastoVenta) - 4}" font-size="10" text-anchor="end" fill="var(--mut)">meta ${Math.round(META.gastoVenta * 100)}%</text>
      <path d="${path}" fill="none" stroke="var(--naranja)" stroke-width="2"/>${puntos}</svg>
    ${ser.length < 3 ? `<div class="src">Por ahora hay ${ser.length === 1 ? "un mes" : "dos meses"}: cada cierre de PANORAMA suma un punto.</div>` : ""}</div>`;
}

// 4. Impuestos: IVA del mes contra el tope de Gastos, y saldo a favor de IIBB por semana
function grafImpuestos(x) {
  const m = x.im;
  if (!m || m.espera || m.error) return `<div class="card graf"><h3>Impuestos</h3><div class="sub">${m?.error ? esc(m.error) : "Esperando el informe de impuestos de PANORAMA."}</div></div>`;
  const T = m.ult.loc.total || {}, iva = T.iva_saldo_mes, tope = x.topeIva;
  const mx = Math.max(tope || 0, iva || 0) * 1.15 || 1, pasa = iva != null && tope && iva > tope;
  const titulo = iva == null ? "IVA del mes: sin dato" : tope ? `IVA del mes ${Mm(iva)}: ${pasa ? "pasado del tope" : Math.round(iva / tope * 100) + " % del tope"} de ${Mm(tope)}` : `IVA del mes ${Mm(iva)}`;
  const mxS = Math.max(1, ...m.semanas.map(s => s.v || 0)) * 1.1, sU = m.semanas[m.semanas.length - 1];
  const tIibb = m.delta == null ? `IIBB a favor ${Mm(sU.v)}: primera semana, todavía sin comparar` : m.delta > 0 ? `IIBB a favor creció ${Mm(m.delta)} en la semana: plata atrapada` : `IIBB a favor bajó ${Mm(-m.delta)} en la semana`;
  return `<div class="card graf"><h3>${titulo}</h3>
    <div class="que">IVA del mes (débito − créditos, fila Total del informe del ${dm(m.ult.fi)}) contra el IVA que Gastos presupuesta por mes</div>
    <div class="bullet"${tip(`IVA del mes $ ${$(iva)} · tope $ ${$(tope)}`)}><div class="v ${pasa ? "mal" : ""}" style="width:${(iva || 0) / mx * 100}%"></div>${tope ? `<div class="t" style="left:${tope / mx * 100}%"></div>` : ""}</div>
    <div class="ley"><span><i style="background:var(--coral)"></i>IVA del mes</span><span><i style="width:3px;background:var(--tx)"></i>Tope ${Mm(tope)}</span></div>
    <h3 style="margin-top:14px">${tIibb}</h3>
    <div class="que">Saldo a favor de IIBB al día de cada informe · en rojo la semana que crece</div>
    <div class="cols" style="height:120px">${m.semanas.map(s => `<div class="col"${tip(`${dm(s.fi)}: IIBB a favor $ ${$(s.v)}${s.crece ? " (creció)" : ""}`)} style="max-width:56px"><span style="height:${(s.v || 0) / mxS * 100}%;background:${s.crece ? "var(--red)" : "var(--plan)"}"></span></div>`).join("")}</div>
    <div class="ejeX">${m.semanas.map(s => `<span style="max-width:56px">${dm(s.fi)}</span>`).join("")}</div></div>`;
}

function inicio(x) {
  const ve = x.ve, b = x.b, fv = x.f, iv = x.i, pr = x.p, al = x.a, en = x.e, mods = [b, fv, iv, x.im, pr, al, en, x.em];
  const todas = { alertas: [...mods.flatMap(o => (o.alertas || []).filter(a => a.t === "r")), ...x.alertas], proximos: [...x.proximos, ...(en.proximos || [])].sort((p, q) => p.f - q.f), faltan: [...x.faltan, ...mods.filter(o => o.error).map(o => o.error)] };
  const T = x.im?.ult?.loc?.total, favor = T ? (T.iva_a_favor_acumulado ?? 0) + (T.iibb_a_favor_acumulado ?? 0) : null;

function proveedores(x) {

  <div class="grid kpis">

    <div class="card"><div class="lbl">A pagar (cuenta corriente)</div><div class="big">${pesos(p.totalPend)}</div><div class="sub">${p.vencido ? `<span class="neg">Vencido ${pesos(p.vencido)}</span> · ` : ""}próximos 7 días ${pesos(p.semana)}</div></div>
    <div class="card"><div class="lbl">IVA a favor del mes</div><div class="big">${pesos(a.iva)}</div><div class="sub">El detalle está en el botón Impuestos</div></div>

      <tr><th>Vence</th><th>Proveedor</th><th>Comprobante</th><th class="n">A pagar</th></tr>
      ${p.pend.map(q => `<tr><td>${dm(q.v)} ${tag(q)}</td><td>${esc(q.pv)}</td><td>${esc(q.comp)}${q.blanco ? "" : " (negro)"}</td><td class="n">${$(q.tot)}</td></tr>`).join("") || `<tr><td colspan="4" class="sub">No hay pagos pendientes.</td></tr>`}
    </table><div class="src">Contra boleta vence a los 7 días; Santa María, a los 30.</div></div></div>
    <div><h2>Compras por semana · blanco y negro</h2><div class="card">
      <div class="ley"><span><i style="background:var(--bar)"></i>En blanco</span><span><i style="background:var(--neg2)"></i>En negro</span></div>
      ${p.sems.map(s => { const t = s.b + s.n; return `<div class="sem"><span>${dm(s.d)}</span><div class="stack" style="width:${t / mxS * 100}%"><div class="b" style="width:${t ? s.b / t * 100 : 0}%"></div><div class="nn" style="width:${t ? s.n / t * 100 : 0}%"></div></div><span class="n">${M(t)}M</span></div>`; }).join("")}
      <div class="src">Semana de lunes a domingo, según fecha de pago (si está pendiente, la del comprobante). La última va hasta hoy.</div>
    </div></div>
  </div>
  <div class="grid two">
    <div><h2>A quién le compramos más · ${mesN.toLowerCase()}</h2><div class="card">
      ${p.top.map(([n, v]) => `<div class="rub"><span>${esc(n)}</span><div class="track"><div class="fill" style="width:${v / mxP * 100}%"></div></div><span class="n">${$(v)}</span></div>`).join("") || `<div class="sub">Todavía no hay compras este mes.</div>`}

    <div><h2>Precios que subieron · últimas 2 semanas</h2><div class="card tbl">
      <table><tr><th>Producto</th><th>Proveedor</th><th class="n">Antes → ahora (neto)</th><th class="n">Suba</th></tr>${p.subas.slice(0, 8).map(filaSuba).join("") || `<tr><td colspan="4" class="sub">No hubo subas.</td></tr>`}</table>
      ${p.subas.length > 8 ? `<details><summary class="sub">Ver los otros ${p.subas.length - 8} productos que subieron (${p.subas.length} en total)</summary><table>${p.subas.slice(8).map(filaSuba).join("")}</table></details>` : ""}

}

function energia(x) {

  const tarj = r => `<div class="card"><div class="lbl">${r.local} · última boleta</div><div class="big">${pesos(r.u.tot)}</div><div class="sub">${$(r.u.kwh)} kWh${r.u.dias ? " en " + r.u.dias + " días" : ""} · $ ${$(r.u.pk)}/kWh · ${r.u.pagada ? "pagada" : r.u.ven ? "vence " + dm(r.u.ven) : "sin pagar"}${r.u.recargo ? ` (+${pesos(r.u.recargo)} recargo)` : ""}</div></div>`;

  <div class="grid kpis">

    <div><h2>Boletas por local</h2><div class="card tbl"><table>
      <tr><th>Local · período</th><th class="n">kWh</th><th class="n">kWh/día</th><th class="n">Total</th><th class="n">$/kWh</th><th class="n">Costo real*</th></tr>
      ${e.boletas.map(b => `<tr><td>${b.local} · ${esc(b.per)}</td><td class="n">${$(b.kwh)}</td><td class="n">${b.dias ? $(b.kwh / b.dias) : "—"}</td><td class="n">${$(b.tot)}</td><td class="n">${$(b.pk)}</td><td class="n">${b.real ? $(b.real) : "—"}</td></tr>`).join("")}
    </table><div class="src">* Sin IVA ni percepciones, que van a cuenta: es lo que realmente se gasta.</div></div></div>
    <div><h2>Alertas</h2><div class="card">${e.alertas.map(a => `<div class="al ${a.t}">${a.h}</div>`).join("") || `<div class="sub">Sin alertas.</div>`}
      ${e.proximos.length ? `<div class="lbl" style="margin-top:8px">Por vencer</div><ul>${e.proximos.map(p => `<li>${dm(p.f)} · ${esc(p.h)}</li>`).join("")}</ul>` : ""}
      ${e.avisos.length ? `<ul class="sub">${e.avisos.map(v => `<li>${esc(v)}</li>`).join("")}</ul>` : ""}</div></div>
  </div>
  ${e.inv ? `<h2>En qué se va la luz de Cárcano · kWh por mes</h2><div class="card">
    <div class="ley"><span><i style="background:var(--bar)"></i>Medido</span><span><i style="background:#c9b26b"></i>Estimado</span><span><i style="background:var(--red)"></i>Sin explicar todavía</span></div>
    ${e.inv.items.map(i => `<div class="rub2"><span>${esc(i.eq)} <span class="tag ${i.medido ? "m" : "e"}">${i.medido ? "medido" : "estimado"}</span></span><div class="track"><div class="fill" style="width:${i.kwh / mxI * 100}%;${i.medido ? "" : "background:#c9b26b"}"></div></div><span class="n">${$(i.kwh)} kWh</span></div>`).join("")}
    ${e.inv.resto > 0 ? `<div class="rub2"><span>Sin explicar todavía</span><div class="track"><div class="fill" style="width:${e.inv.resto / mxI * 100}%;background:var(--red)"></div></div><span class="n">${$(e.inv.resto)} kWh</span></div>` : ""}
    <div class="src">Boleta llevada a un mes: ${$(e.inv.mes)} kWh. Repartido en el inventario: ${$(e.inv.cargado)} kWh (el frío al 100% del tiempo: es techo). Lo lleva la conversación de Energía.</div>
  </div>` : ""}
  <h2>De dónde sale cada número</h2>
  <div class="card sub">Boletas: GASTOS FIJOS Y VARIABLES › GASTOS.xlsx › hoja EPEC (las carga Gastos) · En qué se va la luz: ENERGIA CARCANO › INVENTARIO_CONSUMO_CARCANO.xlsx (hojas CARGAS y CUADRE) · Venta del local: JORNADAS (mes pasado). El sistema solo lee estos archivos; no los modifica.</div>`;

      ${[...c.filas].sort((a, b) => b.tot - a.tot).map(f => `<tr><td>${esc(f.emp)}</td><td class="n">${$(f.rec)}</td><td class="n">${$(f.fuera)}</td><td class="n">${$(f.tot)}</td><td class="n">${$(r.ccEmp[f.emp] || 0)}</td><td class="n">${$(e.saldo[f.emp])}</td></tr>`).join("")}
      <tr><td><b>Total</b></td><td class="n"><b>${$(r.rec)}</b></td><td class="n"><b>${$(r.fuera)}</b></td><td class="n"><b>${$(r.tot)}</b></td><td class="n"><b>${$(r.cc)}</b></td><td></td></tr>
    </table><div class="src">Saldo de cuenta corriente: el último registrado de cada uno. Aguinaldo provisionado: ${pesos(r.agui)} por mes.</div>` : ""}</div></div>
    <div><h2>Alertas</h2><div class="card">
      ${e.alertas.map(a => `<div class="al ${a.t}">${a.h}</div>`).join("") || `<div class="sub">Sin alertas.</div>`}
      <div class="sub" style="margin-top:8px">${mesNom(x.mes).split(" ")[0]}${e.actual.hasta ? ` (al ${dm(e.actual.hasta)})` : ""}: semanales ${pesos(e.actual.gan)} ganados en ${e.actual.semanas} semana(s), ${pesos(e.actual.cc)} descontados de cta. cte.${e.actual.mensuales.map(m => ` · ${esc(m.emp)} ${pesos(m.tot)}`).join("")}. El mes se cierra a fin de mes.</div>
      ${e.avisos.length ? `<ul class="sub">${e.avisos.map(v => `<li>${esc(v)}</li>`).join("")}</ul>` : ""}
    </div></div>
  </div>
  <h2>Horas por semana · semanales</h2>
  <div class="card tbl"><table>
    <tr><th></th>${e.semsS.map(d => `<th class="n">${dm(new Date(d))}</th>`).join("")}</tr>
    ${e.horas.map(h => `<tr><td>${esc(h.emp)}${h.vh ? ` <span class="sub">$ ${$(h.vh)}/h</span>` : ""}</td>${h.celdas.map(z => `<td class="n">${z ? `<div style="display:flex;align-items:center;justify-content:flex-end;gap:6px"><span style="display:inline-block;height:10px;width:${Math.max(2, (z.h || 0) / mxH * 60)}px;border-radius:2px;background:${z.inc ? "var(--plan)" : "var(--bar)"}"></span>${(z.h ?? 0).toLocaleString("es-AR")}${z.inc ? "*" : ""}</div>` : "—"}</td>`).join("")}</tr>`).join("")}
  </table><div class="src">* Semana sin montos pagados cargados (puede tener horas incompletas).</div></div>
  <h2>De dónde sale cada número</h2>
  <div class="card sub">Sueldos, horas, cuenta corriente y pagos: EMPLEADOS › RESUMEN_SUELDOS.xlsx (hojas SEMANAS y MESES, lo actualiza Empleados) · Cargas sociales y sueldos estimados: GASTOS.xlsx › Hoja1. El sistema solo lee estos archivos; no los modifica. Los datos de cada empleado no salen de esta PC.</div>`;
}

let semana = -1; // -1 = todo el mes
function bancos(x) {
  const b = x.b;
  if (b.error) return cabecera("Bancos", `<a href="#">Inicio</a> › Bancos`, lectB(b)) + `<div class="card">${esc(b.error)}</div>`;
  const s = semana >= 0 ? b.semanas[semana] : null;
  const movs = s ? b.delMes.filter(m => m.d >= s.desde && m.d <= s.hasta) : b.delMes;
  const porG = {}; for (const m of movs) porG[m.g] = (porG[m.g] || 0) + m.m;
  const sal = Object.entries(porG).filter(e => e[1] < 0).map(([k, v]) => [k, -v]).sort((a, c) => c[1] - a[1]);
  const ent = Object.entries(porG).filter(e => e[1] > 0).sort((a, c) => c[1] - a[1]);
  const barras = (l, cls) => { const mx = l[0]?.[1] || 1; return l.map(([k, v]) => `<div class="rub"><span>${esc(k)}</span><div class="track"><div class="fill ${cls}" style="width:${v / mx * 100}%"></div></div><span class="n">${$(v)}</span></div>`).join("") || `<div class="sub">Nada en este período.</div>`; };
  const suma = l => l.reduce((a, e) => a + e[1], 0);
  const p = b.prevB, fila = (n, k) => `<tr><td>${n}</td><td class="n">${$(b.costos[k])}</td><td class="n">${p ? $(p[k]) : "—"}</td></tr>`;
  const per = s ? `${dm(s.desde)} al ${dm(s.hasta)}` : `1 al ${dm(b.ultimo)}`;
  return cabecera(`Bancos · ${mesNom(x.mes)}`, `<a href="#">Inicio</a> › Bancos`, lectB(b)) + `
  <div class="grid kpis">
    ${b.cuentas.map(c => `<div class="card"><div class="lbl">${c.nombre}${c.fSaldo ? " (" + dm(c.fSaldo) + ")" : ""}</div><div class="big ${c.saldo < 0 ? "neg" : ""}">${pesos(c.saldo)}</div><div class="sub">${c.nombre === "Bancor" && b.pend.length ? `Con e-cheq pendiente: <b class="neg">${pesos(b.ajustado)}</b>` : c.saldo == null ? "No se informa" : esc(c.fuente)}</div></div>`).join("")}
    <div class="card"><div class="lbl">Total en bancos</div><div class="big ${b.total < 0 ? "neg" : ""}">${pesos(b.total)}</div><div class="sub">Suma de los saldos de arriba</div></div>
  </div>
  <h2>Lo que viene · próximos 14 días</h2>
  <div class="grid two">
    <div class="card">${b.alertas.filter(a => a.t === "r").map(a => `<div class="al r">${a.h}</div>`).join("") || `<div class="sub">El Bancor alcanza para lo que viene.</div>`}</div>
    <div class="card tbl"><table><tr><th>Fecha</th><th>Qué</th><th>Cuenta</th><th class="n">Monto</th></tr>
      ${b.prox.map(e => `<tr><td>${dm(e.d)}</td><td>E-cheq Fenovo N°${esc(e.n)}</td><td>Bancor</td><td class="n">${$(e.monto)}</td></tr>`).join("") || `<tr><td colspan="4" class="sub">No hay e-cheqs en los próximos 14 días.</td></tr>`}
    </table>${b.siguientes.length ? `<div class="src">Después: ${b.siguientes.map(e => `${dm(e.d)} N°${esc(e.n)} $ ${$(e.monto)}`).join(" · ")}.</div>` : ""}</div>
  </div>
  <h2>Adónde se fue la plata · ${per}</h2>
  <div class="tabs"><button class="btn ${semana < 0 ? "on" : ""}" data-s="-1">Mes</button>${b.semanas.map((w, i) => `<button class="btn ${semana === i ? "on" : ""}" data-s="${i}">${dm(w.desde)}–${dm(w.hasta)}</button>`).join("")}</div>
  <div class="grid two">
    <div class="card"><div class="lbl">Salidas · $ ${$(suma(sal))}</div>${barras(sal, "")}</div>
    <div class="card"><div class="lbl">Entradas · $ ${$(suma(ent))}</div>${barras(ent, "in")}
      <div class="src">Las transferencias entre cuentas de la SAS no cuentan (no es plata que entra o sale).${b.cobertura.map(c => " " + esc(c) + ".").join("")}</div></div>
  </div>
  <div class="grid two">
    <div><h2>Lo que cobran los bancos</h2><div class="card tbl"><table>
      <tr><th>Concepto</th><th class="n">${mesNom(x.mes).split(" ")[0]} (al ${dm(b.ultimo)})</th><th class="n">${p ? p.nombre[0].toUpperCase() + p.nombre.slice(1) : "Mes anterior"}</th></tr>
      ${fila("SIRCREB (IIBB adelantado)", "sircreb")}${fila("Imp. débitos y créditos", "impdc")}${fila("Comisiones e intereses", "comis")}
    </table></div></div>
    <div><h2>Para revisar</h2><div class="card">
      ${b.sinId.length ? `<details><summary><b>${b.sinId.length} movimientos sin identificar</b> · neto ${pesos(b.sinId.reduce((a, m) => a + m.m, 0))}</summary><div class="tbl"><table>${b.sinId.map(m => `<tr><td>${dm(m.d)}</td><td>${esc(m.cuenta)}</td><td>${esc(m.con)}</td><td class="n">${pesos(m.m)}</td></tr>`).join("")}</table></div></details>` : `<div class="sub">No hay movimientos sin identificar.</div>`}
      <div class="lbl" style="margin-top:10px">Control de cada cuenta (el saldo de cada movimiento cierra con el anterior)</div>
      <ul class="sub">${b.cuentas.filter(c => c.movs.length).map(c => `<li>${c.nombre} ${c.cortes ? `✗ no cierra en ${c.cortes} movimiento(s), el primero el ${dm(c.primerCorte)}` : "✓"}</li>`).join("")}</ul>
      ${b.avisos.filter(a => !/no cierra/.test(a)).map(a => `<div class="sub">${esc(a)}</div>`).join("")}
    </div></div>
  </div>
  <h2>De dónde sale cada número</h2>
  <div class="card sub">Saldos y movimientos: BANCOS.xlsx › hojas BANCOR, FRANCES, MERCADO PAGO, MACRO (último "Saldo s/extracto" y categoría de cada movimiento), SALDOS (si hay un saldo más nuevo) y EFECTIVO · E-cheqs: FENOVO › FRIOTEKA_Fenovo.xlsx › PAGOS (fecha de débito, sin anulados) · Mes anterior: cierre de Bancos de PANORAMA. No se usa la hoja POSICION. El sistema solo lee estos archivos; no los modifica.</div>`;
}

function gastos(x) {
  const ve = x.ve, rub = Object.entries(x.rubros).sort((a, b) => b[1] - a[1]), max = rub[0]?.[1] || 1;
  const porCat = {}; for (const r of x.va.filas) porCat[r.cat] = (porCat[r.cat] || 0) + (r.monto || 0);
  const ep = x.ep, luzTxt = Object.entries(ep).map(([l, e]) => `${l === "CARCANO" ? "Cárcano" : l === "SAN MARTIN" ? "SM" : l} ${$(e.kwh)} kWh a $${$(e.pk)}/kWh`).join(" · ");
  const fila = (n, k) => `<tr><td>${n}</td><td class="n">${$(x.fijo[k])}</td><td class="n">${$(x.varL[k])}</td><td class="n">${$(x.fijo[k] + x.varL[k])}</td><td class="n">${k === "sas" ? "—" : pct(x.pctL(k))}</td></tr>`;
  return cabecera(`Gastos · ${mesNom(x.mes)}`, `<a href="#">Inicio</a> › Gastos`, lectG(x)) + `
  <div class="grid kpis">
    <div class="card"><div class="lbl">Gasto del mes</div><div class="big">$ ${$(x.total)}</div><div class="sub">Fijo ${$(x.fijoTot)} · Variable ${$(x.varTot)}</div></div>
    <div class="card"><div class="lbl">Gasto sobre la venta</div><div class="big">${pct(x.pct)}</div><div class="sub">${x.prev ? `${x.prev.nombre[0].toUpperCase() + x.prev.nombre.slice(1)}: ${String(x.prev.pct).replace(".", ",")} % · ` : ""}proporcional a ${ve?.dias || 0} días de venta</div></div>
    <div class="card"><div class="lbl">Gasto fijo por día</div><div class="big">$ ${$(x.fijoTot / x.diasMes)}</div><div class="sub">Lo que cuesta abrir cada día</div></div>
    <div class="card"><div class="lbl">Venta${ve?.ultimo ? " al " + dm(ve.ultimo) : ""}</div><div class="big">$ ${$(ve?.total)}</div><div class="sub">SM ${$(ve?.sm)} · Cárcano ${$(ve?.carcano)}</div></div>
  </div>
  <h2>Por local</h2>
  <div class="card tbl"><table>
    <tr><th>Local</th><th class="n">Fijo</th><th class="n">Variable</th><th class="n">Total</th><th class="n">% de su venta</th></tr>
    ${fila("San Martín", "sm")}${fila("Cárcano", "carcano")}${fila("SAS (compartido)", "sas")}
  </table><div class="src">SAS = gestión, ${x.imp.planesTxt.length ? x.imp.planesTxt.join(" y ") + " de IIBB, " : ""}Municipalidad ${x.imp.perAnt}, y los variables que no son de un solo local.${x.h1?.planesHoja1?.size ? ` Los planes ${[...x.h1.planesHoja1].join(" y ")} de IIBB ya van en el fijo de cada local (GASTOS › Hoja1).` : ""}${x.sueldos ? ` Sueldos: el real de ${MESES[x.sueldos.m.getMonth()].toLowerCase()} (${pesos(x.sueldos.real)}) en vez del estimado de Hoja1 (${pesos(x.sueldos.est)}), repartido entre los locales como el estimado (SM ${x.sueldos.aj.sm < 0 ? "−" : "+"}${$(Math.abs(x.sueldos.aj.sm))}, Cárcano ${x.sueldos.aj.carcano < 0 ? "−" : "+"}${$(Math.abs(x.sueldos.aj.carcano))}).` : ""}</div></div>
  <div class="grid two">
    <div><h2>Fijo por rubro</h2><div class="card">
      ${rub.map(([n, v]) => `<div class="rub"><span>${n}</span><div class="track"><div class="fill" style="width:${Math.max(0, v / max * 100)}%"></div></div><span class="n">${$(v)} · ${Math.round(v / x.fijoTot * 100)}%</span></div>`).join("")}
      ${luzTxt ? `<div class="src">Luz (última factura): ${luzTxt}.</div>` : ""}
    </div></div>
    <div><h2>Alertas</h2><div class="card">${bloqueAlertas(x)}</div></div>
  </div>
  <h2>Variables del mes · $ ${$(x.varTot)}</h2>
  <div class="card tbl"><table id="vars">
    <tr><th>Fecha</th><th>Categoría</th><th>Proveedor</th><th>Local</th><th class="n">Monto</th></tr>
    ${x.va.filas.map((r, i) => `<tr class="fila" data-i="${i}"><td>${dm(r.d)}</td><td>${esc(r.cat)}</td><td>${esc(r.prov) || "—"}</td><td>${esc(r.localTxt)}</td><td class="n">${r.monto == null ? "sin monto" : $(r.monto)}</td></tr><tr class="det" hidden><td colspan="5">${esc(r.con)}</td></tr>`).join("") || `<tr><td colspan="5" class="sub">Todavía no hay variables cargados este mes.</td></tr>`}
  </table><div class="src">Por categoría: ${Object.entries(porCat).sort((a, b) => b[1] - a[1]).map(([c, v]) => `${esc(c)} ${$(v)}`).join(" · ")}. Tocá una fila para ver el detalle.</div></div>
  <h2>De dónde sale cada número</h2>
  <div class="card sub">Fijos de cada local y rubros: GASTOS.xlsx › Hoja1 (renglones TOTAL GASTOS, TOTAL ALQUILER, TOTAL SUELDOS, TOTAL APORTES, TOTAL EPEC, TOTAL VARIOS) · Sueldos: el real del último mes cerrado de EMPLEADOS › RESUMEN_SUELDOS.xlsx (hoja MESES) en vez del estimado de Hoja1 · Gestión: renglones GESTION de Hoja1 · Planes IIBB y Municipalidad: hoja IMPUESTOS · Variables: hoja VARIABLES · Luz: hoja EPEC · Venta: JORNADAS › ${MESES[x.mes.getMonth()]}_CLAUDE.xlsx · Mes anterior: cierre de PANORAMA. El sistema solo lee estos archivos; no los modifica.</div>`;
}

// ---------- Arranque ----------
let datos = null;
function pintar(arriba = true) {
  if (!datos) return;
  const h = location.hash;
  $app.innerHTML = h === "#gastos" ? gastos(datos) : h === "#bancos" ? bancos(datos) : h === "#fenovo" ? fenovo(datos) : h === "#impuestos" || h === "#iva" ? impuestosPantalla(datos) : h === "#proveedores" ? proveedores(datos) : h === "#almacen" ? almacen(datos) : h === "#energia" ? energia(datos) : h === "#empleados" ? empleados(datos) : inicio(datos);
  $app.dataset.area = h.slice(1) || "inicio";
  const kp = $app.querySelector(".grid.kpis"), hd = $app.querySelector("header"); if (kp && hd) hd.appendChild(kp); // los números clave van en la banda oscura
  document.getElementById("releer").onclick = cargar;
  const t = document.getElementById("vars"); if (t) t.onclick = e => { const tr = e.target.closest("tr.fila"); if (tr) tr.nextElementSibling.hidden = !tr.nextElementSibling.hidden; };
  for (const bt of document.querySelectorAll("[data-s]")) bt.onclick = () => { semana = +bt.dataset.s; const y = scrollY; pintar(false); scrollTo(0, y); };
  if (arriba) scrollTo(0, 0);
}
async function cargar() {
  $app.innerHTML = `<div class="centro"><p>Leyendo los Excel…</p></div>`;
  try {
    datos = await calcular();
    let F = null; try { F = await libro(RUTA.fenovo); } catch {}
    try { datos.b = await calcularBancos(datos.hoy, datos.mes, F); } catch (e) { datos.b = { error: `No pude leer ${RUTA.bancos}: ${e.message || e}` }; }
    try { if (!F) throw new Error("no se pudo abrir el archivo"); datos.f = calcularFenovo(F, datos.hoy, datos.mes); } catch (e) { datos.f = { error: `No pude leer ${RUTA.fenovo}: ${e.message || e}` }; }
    let P = null; try { P = await libro(RUTA.proveedores); } catch {}
    try { datos.i = calcularIva(datos, F, P); } catch (e) { datos.i = { error: `No pude armar el IVA: ${e.message || e}` }; }
    try { let IM = null; try { IM = await libro(RUTA.impuestos); } catch (e) { if (!(e?.name === "NotFoundError" || /no esta/.test(e?.message))) throw e; } datos.im = calcularImpuestos(IM, datos.hoy); } catch (e) { datos.im = { error: `No pude leer ${RUTA.impuestos}: ${e.message || e}` }; }
    try { if (!P) throw new Error("no se pudo abrir el archivo"); datos.p = calcularProveedores(P, datos.hoy, datos.mes); } catch (e) { datos.p = { error: `No pude leer ${RUTA.proveedores}: ${e.message || e}` }; }
    try {
      const mesAnt = new Date(datos.mes.getFullYear(), datos.mes.getMonth() - 1, 1);
      let veAnt = null; try { const V = await libro(RUTA.ventas(mesAnt)); veAnt = leerVentas(grilla(V.wb.Sheets[V.wb.SheetNames[0]]), mesAnt); } catch {}
      datos.veAnt = veAnt;
      let VIS = null, CA = null; try { VIS = await libro(RUTA.visitas); } catch {} try { CA = await libro(RUTA.almacen); } catch {}
      datos.a = calcularAlmacen(datos, veAnt, VIS, CA);
    } catch (e) { datos.a = { error: `No pude armar Compras almacén: ${e.message || e}` }; }
    try { let INV = null; try { INV = await libro(RUTA.inventarioLuz); } catch {} datos.e = calcularEnergia(datos, INV); } catch (e) { datos.e = { error: `No pude armar Energía: ${e.message || e}` }; }
    try { const RS = datos.RS || await libro(RUTA.sueldos); datos.em = calcularEmpleados(datos, RS); } catch (e) { datos.em = { error: `No pude leer ${RUTA.sueldos}: ${e.message || e}` }; }
    pintar();
  }
  catch (e) { $app.innerHTML = `<div class="centro"><h1>No pude leer los Excel</h1><p>${esc(e.message || e)}</p><button class="btn pri" id="otra">Elegir la carpeta TODO CLAUDE</button></div>`; document.getElementById("otra").onclick = elegir; }
}
async function elegir() {
  try { carpeta = await window.showDirectoryPicker({ id: "todoclaude", mode: "read" }); await guardarCarpeta(carpeta); cargar(); } catch {}
}
function pedirCarpeta(yaHay) {
  $app.innerHTML = `<div class="centro"><h1>Administración FRIOTEKA</h1>
  <p>${yaHay ? "Chrome necesita que confirmes otra vez el permiso para leer la carpeta." : "La primera vez, elegí la carpeta <b>Escritorio › TODO CLAUDE</b>. Chrome solo la va a leer: no cambia nada y no sube nada a internet."}</p>
  <button class="btn pri" id="ok">${yaHay ? "Permitir leer TODO CLAUDE" : "Elegir la carpeta TODO CLAUDE"}</button></div>`;
  document.getElementById("ok").onclick = async () => {
    if (yaHay && (await carpeta.requestPermission({ mode: "read" })) === "granted") cargar(); else elegir();
  };
}
window.addEventListener("hashchange", pintar);
// Al tocar (o pasar el mouse por) una barra o un punto, muestra el número exacto
const $tip = document.getElementById("tip");
function mostrarTip(e) {
  const el = e.target.closest("[data-tip]"); if (!el) { $tip.style.display = "none"; return; }
  $tip.textContent = el.dataset.tip; $tip.style.display = "block";
  const w = $tip.offsetWidth, h = $tip.offsetHeight;
  $tip.style.left = Math.max(8, Math.min(innerWidth - w - 8, e.clientX - w / 2)) + "px";
  $tip.style.top = (e.clientY - h - 14 < 8 ? e.clientY + 18 : e.clientY - h - 14) + "px";
}
document.addEventListener("pointerdown", mostrarTip);
document.addEventListener("pointermove", e => { if (e.pointerType === "mouse") mostrarTip(e); });
addEventListener("scroll", () => { $tip.style.display = "none"; }, { passive: true });
if (window.__leerPrueba) cargar();
else if (!window.showDirectoryPicker) $app.innerHTML = `<div class="centro"><h1>Abrilo en Chrome</h1><p>Este navegador no puede leer carpetas de la PC.</p></div>`;
else {
  carpeta = await cargarCarpeta();
  if (carpeta && (await carpeta.queryPermission({ mode: "read" })) === "granted") cargar();
  else pedirCarpeta(!!carpeta);
}
</script>
</body>
</html>
